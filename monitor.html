// ─── sector definitions ───────────────────────────────────────────────────────
const SECTORS={
  IT_RETAIL:{
    label:'IT Retail',
    stocks:['ADVICE','COM7'],
    desc:'Pure-play electronics retail — comparable peers',
    icon:'📡',
  },

  },

const STOCKS=['ADVICE','COM7','JMART'];
const STOCK_COLOR={'ADVICE':'#6366f1','COM7':'#10b981','JMART':'#f59e0b'};
const STOCK_SECTOR={ADVICE:'IT_RETAIL',COM7:'IT_RETAIL',JMART:'DIVERSIFIED'};

const TRAFFIC_CFG={
  google_trends: {label:'Google Trends',w:0.35,max:100},
  similarweb:    {label:'SimilarWeb',   w:0.30,max:5000},
  app_downloads: {label:'App DL',       w:0.20,max:500},
  google_reviews:{label:'Reviews',      w:0.15,max:200},
  shopee_sales:  {label:'Shopee',       w:0.10,max:10000},
  manual_count:  {label:'Manual',       w:0.05,max:100},
};
const CRED={pantip:4,facebook:2,facebook_grp:2,twitter:3,google_rev:4,google_reviews:4,
            official:5,news:5,news_official:5,tiktok:2,shopee_rev:3};

// ─── data layer ──────────────────────────────────────────────────────────────

}

// ─── time decay ───────────────────────────────────────────────────────────────
const decay=d=>Math.exp(-Math.LN2/14*Math.max(0,(Date.now()-new Date(d).getTime())/86400000));

// ─── calcTrafficLevel (0-100) ─────────────────────────────────────────────────
function calcTrafficLevel(traffic){
  if(!traffic?.length) return null;
  const cutDate=new Date(); cutDate.setDate(cutDate.getDate()-30);
  const cut=cutDate.toISOString().slice(0,10);
  const recent=traffic.filter(t=>t.date>=cut);
  if(!recent.length) return null;
  const latest={};
  recent.forEach(t=>{ if(!latest[t.source]||t.date>latest[t.source].date) latest[t.source]=t; });
  let ws=0,wt=0;
  Object.entries(latest).forEach(([src,e])=>{
    const cfg=TRAFFIC_CFG[src]; if(!cfg) return;
    ws+=cfg.w*Math.min(100,e.value/cfg.max*100); wt+=cfg.w;
  });
  return wt? Math.round(ws/wt) : null;
}

// ─── calcPromoSignal (-100 to +100) ──────────────────────────────────────────
function calcPromoSignal(prices){
  if(!prices?.length) return null;
  const monday=d=>{const dt=new Date(d+'T00:00:00');dt.setDate(dt.getDate()-((dt.getDay()+6)%7));return dt.toISOString().slice(0,10);};
  const byWeek={};
  prices.forEach(e=>{
    if(!e.promoScore) return;
    const w=monday(e.date);
    if(!byWeek[w]) byWeek[w]={sum:0,n:0};
    byWeek[w].sum+=e.promoScore; byWeek[w].n++;
  });
  const weeks=Object.keys(byWeek).sort();
  if(weeks.length<2) return null;
  const cur=byWeek[weeks[weeks.length-1]].sum/byWeek[weeks[weeks.length-1]].n;
  const base=weeks.slice(0,-1).reduce((s,w)=>s+byWeek[w].sum/byWeek[w].n,0)/(weeks.length-1);
  if(!base) return null;
  const ratio=cur/base;
  // ratio=1.0→0, ratio>1.5→-100, ratio<0.7→+50
  if(ratio>=1.5) return -100;
  if(ratio<=0.7) return 50;
  if(ratio>=1.0) return Math.round(-(ratio-1.0)/0.5*100);
  return Math.round((1.0-ratio)/0.3*50);
}

// ─── multi-factor signal ──────────────────────────────────────────────────────
function calcSignal(data,stock){
  const sd=data?.stocks?.[stock]||{};

  // Factor 1: Sentiment (40%) — credibility × feedback × time-decay
  let ws=0,wt=0;
  (sd.sentiments||[]).forEach(e=>{
    const c=CRED[e.source]||2;
    const w=c*Math.max(1,e.feedbackCount||1)*decay(e.date);
    const v=e.sentiment==='positive'?1:e.sentiment==='negative'?-1:0;
    ws+=v*w; wt+=w;
  });
  const sentScore=wt?Math.round(ws/wt*100):null;

  // Factor 2: Traffic (25%)
  const trafRaw=calcTrafficLevel(sd.traffic);
  const trafScore=trafRaw!==null?Math.round((trafRaw-50)*2):null;

  // Factor 3: Promo discipline (20%)
  const promoScore=calcPromoSignal(sd.prices);

  // Factor 4: News flow (15%)
  let nws=0,nwt=0;
  (sd.news||[]).forEach(e=>{
    const c=CRED[e.source]||3;
    const w=c*decay(e.date);
    const v=e.sentiment==='positive'?1:e.sentiment==='negative'?-1:0;
    nws+=v*w; nwt+=w;
  });
  const newsScore=nwt?Math.round(nws/nwt*100):null;

  // Weighted composite
  const WEIGHTS=[{s:sentScore,w:0.40},{s:trafScore,w:0.25},{s:promoScore,w:0.20},{s:newsScore,w:0.15}];
  let cws=0,cwt=0;
  WEIGHTS.forEach(({s,w})=>{ if(s!==null){cws+=s*w; cwt+=w;} });
  const composite=cwt?Math.round(cws/cwt):null;

  // Conviction
  const sentItems=sd.sentiments||[];
  const sources=new Set(sentItems.map(e=>e.source)).size;
  const scores=sentItems.map(e=>e.sentiment==='positive'?1:e.sentiment==='negative'?-1:0);
  const mean=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:0;
  const std=scores.length>1?Math.sqrt(scores.reduce((a,b)=>a+(b-mean)**2,0)/scores.length):1;
  const conviction=sentItems.length>=4&&sources>=3&&std<0.5?'HIGH':sentItems.length>=2&&sources>=2?'MED':'LOW';

  // Staleness
  const allDates=[...(sd.sentiments||[]),...(sd.prices||[]),...(sd.traffic||[]),...(sd.news||[])].map(e=>e.date).sort().reverse();
  const staleDays=allDates.length?Math.floor((Date.now()-new Date(allDates[0]).getTime())/86400000):null;

  const factors=[
    {key:'sent', label:'Sentiment', icon:'💬', score:sentScore,  w:0.40},
    {key:'traf', label:'Traffic',   icon:'📈', score:trafScore,  w:0.25},
    {key:'promo',label:'Promo Disc',icon:'🏷️', score:promoScore, w:0.20},
    {key:'news', label:'News Flow', icon:'📰', score:newsScore,  w:0.15},
  ];
  return {composite,factors,conviction,staleDays};
}

// ─── peer z-score ─────────────────────────────────────────────────────────────
function calcPeerZ(data,stock,sectorStocks){
  const vals=sectorStocks.map(s=>calcSignal(data,s).composite).filter(v=>v!==null);
  if(vals.length<2) return null;
  const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
  const std=Math.sqrt(vals.reduce((a,b)=>a+(b-mean)**2,0)/vals.length);
  const val=calcSignal(data,stock).composite;
  return (val!==null&&std>0)?Math.round((val-mean)/std*10)/10:null;
}

// ─── signal rating ────────────────────────────────────────────────────────────
function signalRating(score){
  if(score===null) return {label:'N/A',       color:'#475569',bg:'#1e293b'};
  if(score>=60)    return {label:'STRONG BUY', color:'#16a34a',bg:'#052e16'};
  if(score>=20)    return {label:'BUY',        color:'#22c55e',bg:'#052e16'};
  if(score>=-20)   return {label:'HOLD',       color:'#eab308',bg:'#1c1400'};
  if(score>=-60)   return {label:'SELL',       color:'#f97316',bg:'#1c0a00'};
  return               {label:'STRONG SELL',   color:'#ef4444',bg:'#200000'};
}

function timeAgo(d){
  if(d===null||d===undefined) return '—';
  const n=Math.floor((Date.now()-new Date(d*86400000+Date.now()%86400000).getTime())/86400000);
  // d is already days
  return d===0?'วันนี้':d===1?'เมื่อวาน':`${d} วันที่แล้ว`;
}

function ConvictionBadge({conviction}){

  const s=map[conviction]||map.LOW;
  return(
    <span style={{padding:'2px 8px',borderRadius:4,background:s.bg,color:s.c,fontSize:11,fontWeight:700,border:`1px solid ${s.c}40`}}>
      {conviction} conviction
    </span>
  );
}

// ─── diverging factor bar ─────────────────────────────────────────────────────
function FactorBar({icon,label,score,weight}){
  if(score===null) return(
    <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:5}}>
      <span style={{fontSize:13}}>{icon}</span>
      <span style={{fontSize:11,color:'#64748b',width:72}}>{label}</span>
      <div style={{flex:1,height:6,background:'#1e293b',borderRadius:3}}/>
      <span style={{fontSize:10,color:'#475569',width:28,textAlign:'right'}}>—</span>
      <span style={{fontSize:10,color:'#334155',width:28,textAlign:'right'}}>{Math.round(weight*100)}%</span>
    </div>
  );
  const pct=Math.max(0,Math.min(100,Math.abs(score)));
  const positive=score>=0;
  const color=score>=20?'#22c55e':score<=-20?'#ef4444':'#eab308';
  return(
    <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:5}}>
      <span style={{fontSize:13}}>{icon}</span>
      <span style={{fontSize:11,color:'#94a3b8',width:72}}>{label}</span>
      <div style={{flex:1,height:6,background:'#1e293b',borderRadius:3,position:'relative'}}>
        {/* center line */}
        <div style={{position:'absolute',left:'50%',top:0,width:1,height:'100%',background:'#334155'}}/>
        {positive?(
          <div style={{position:'absolute',left:'50%',width:`${pct/2}%`,height:'100%',background:color,borderRadius:'0 3px 3px 0',transition:'width .4s'}}/>
        ):(
          <div style={{position:'absolute',right:'50%',width:`${pct/2}%`,height:'100%',background:color,borderRadius:'3px 0 0 3px',transition:'width .4s'}}/>
        )}
      </div>
      <span style={{fontSize:11,fontFamily:'DM Mono,monospace',color,width:36,textAlign:'right'}}>{score>0?`+${score}`:score}</span>
      <span style={{fontSize:10,color:'#475569',width:28,textAlign:'right'}}>{Math.round(weight*100)}%</span>
    </div>
  );
}

// ─── stock signal card ────────────────────────────────────────────────────────
function StockSignalCard({stock,data,sectorStocks,showZ}){
  const color=STOCK_COLOR[stock];
  const {composite,factors,conviction,staleDays}=useMemo(()=>calcSignal(data,stock),[data,stock]);
  const rating=signalRating(composite);
  const peerZ=showZ&&sectorStocks?calcPeerZ(data,stock,sectorStocks):null;
  const stale=staleDays!==null&&staleDays>7;

  return(
    <div style={{background:'#1e293b',border:`1px solid ${stale?'#92400e':'#334155'}`,borderRadius:12,overflow:'hidden',display:'flex',flexDirection:'column',minWidth:0}}>
      {/* header */}
      <div style={{background:`${color}18`,borderBottom:`2px solid ${color}`,padding:'10px 14px',display:'flex',alignItems:'center',gap:8}}>
        <div style={{width:8,height:8,borderRadius:'50%',background:color,boxShadow:`0 0 8px ${color}`}}/>
        <span style={{fontWeight:700,fontSize:16,color:'#f1f5f9'}}>{stock}</span>
        {staleDays!==null&&(
          <span style={{fontSize:10,color:stale?'#fbbf24':'#475569',marginLeft:'auto'}}>
            {staleDays===0?'วันนี้':staleDays===1?'เมื่อวาน':`${staleDays}d ago`}
          </span>
        )}
      </div>

      {stale&&(
        <div style={{background:'#451a03',borderBottom:'1px solid #92400e',padding:'5px 14px',fontSize:11,color:'#fbbf24'}}>
          ⚠️ ข้อมูลเก่ากว่า 7 วัน — ความแม่นยำลดลง
        </div>
      )}

      <div style={{padding:'14px',flex:1,display:'flex',flexDirection:'column',gap:12}}>
        {/* composite score + rating */}
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <div style={{textAlign:'center',flexShrink:0}}>
            <div style={{fontSize:42,fontWeight:800,fontFamily:'DM Mono,monospace',color:rating.color,lineHeight:1}}>
              {composite!==null?(composite>0?`+${composite}`:composite):'—'}
            </div>
            <div style={{fontSize:10,color:'#64748b',marginTop:2}}>composite</div>
          </div>
          <div style={{flex:1}}>
            <div style={{padding:'5px 10px',borderRadius:6,background:rating.bg,display:'inline-block',marginBottom:6}}>
              <span style={{fontWeight:800,fontSize:13,color:rating.color}}>{rating.label}</span>
            </div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
              <ConvictionBadge conviction={conviction}/>
              {peerZ!==null&&(
                <span style={{padding:'2px 8px',borderRadius:4,background:'#0f172a',color:'#94a3b8',fontSize:11,fontWeight:700,border:'1px solid #334155'}}>
                  vs peers: {peerZ>0?`+${peerZ}`:peerZ}σ
                </span>
              )}
            </div>
          </div>
        </div>

        {/* factor bars */}
        <div style={{borderTop:'1px solid #334155',paddingTop:10}}>
          <div style={{fontSize:10,color:'#475569',marginBottom:7,textTransform:'uppercase',letterSpacing:.5,display:'flex',justifyContent:'space-between'}}>
            <span>Factor breakdown</span>
            <span style={{color:'#334155'}}>neg ← 0 → pos</span>
          </div>
          {factors.map(f=>(
            <FactorBar key={f.key} icon={f.icon} label={f.label} score={f.score} weight={f.w}/>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── alerts panel ─────────────────────────────────────────────────────────────
function AlertsPanel({data}){
  const rows=[];
  STOCKS.forEach(stock=>{
    const {composite,staleDays}=calcSignal(data,stock);
    const sd=data?.stocks?.[stock]||{};
    // promo alert
    const monday=d=>{const dt=new Date(d+'T00:00:00');dt.setDate(dt.getDate()-((dt.getDay()+6)%7));return dt.toISOString().slice(0,10);};
    const byWeek={};
    (sd.prices||[]).forEach(e=>{
      if(!e.promoScore) return;
      const w=monday(e.date);
      if(!byWeek[w]) byWeek[w]={sum:0,n:0};
      byWeek[w].sum+=e.promoScore; byWeek[w].n++;
    });
    const weeks=Object.keys(byWeek).sort();
    if(weeks.length>=2){
      const cur=byWeek[weeks[weeks.length-1]].sum/byWeek[weeks[weeks.length-1]].n;
      const base=weeks.slice(0,-1).reduce((s,w)=>s+byWeek[w].sum/byWeek[w].n,0)/(weeks.length-1);
      if(base&&cur/base>=1.25) rows.push({stock,type:'warning',text:`โปร +${Math.round((cur/base-1)*100)}% จาก baseline — margin pressure`,icon:'🔥'});
    }
    if(composite!==null&&composite<=-30) rows.push({stock,type:'warning',text:`Composite signal ต่ำ (${composite}) — SELL territory`,icon:'📉'});
    if(composite!==null&&composite>=40)  rows.push({stock,type:'good',   text:`Composite signal สูง (+${composite}) — BUY territory`,   icon:'📈'});
    if(staleDays!==null&&staleDays>7)    rows.push({stock,type:'warning',text:`ข้อมูลเก่า ${staleDays} วัน — ควรอัพเดต`,icon:'⏰'});
  });
  if(!rows.length) return(
    <div style={{background:'#052e16',border:'1px solid #166534',borderRadius:8,padding:'10px 14px',color:'#4ade80',fontSize:13}}>
      ✅ ไม่มีสัญญาณเตือน — ทุก stock ปกติ
    </div>
  );
  return(
    <div style={{display:'flex',flexDirection:'column',gap:6}}>
      {rows.map((r,i)=>{
        const c=STOCK_COLOR[r.stock];
        const bg=r.type==='warning'?'#451a03':'#052e16';
        const bc=r.type==='warning'?'#92400e':'#166534';
        const tc=r.type==='warning'?'#fbbf24':'#4ade80';
        return(
          <div key={i} style={{background:bg,border:`1px solid ${bc}`,borderRadius:7,padding:'8px 12px',display:'flex',alignItems:'center',gap:10}}>
            <span style={{fontSize:16}}>{r.icon}</span>
            <span style={{fontWeight:700,fontSize:12,padding:'2px 7px',borderRadius:4,background:`${c}25`,color:c}}>{r.stock}</span>
            <span style={{fontSize:13,color:tc}}>{r.text}</span>
          </div>
        );
      })}
    </div>
  );
}

// ─── sector heatmap ───────────────────────────────────────────────────────────
function heatBg(norm){
  if(norm===null) return '#1e293b';
  const h=Math.round(norm*1.2);
  return `hsl(${h},55%,22%)`;
}
function heatText(norm){
  if(norm===null) return '#475569';
  return norm>=60?'#86efac':norm>=35?'#fde68a':'#fca5a5';
}

function HeatmapWithSector({data}){
  const COLS=[
    {key:'sent',   label:'Sentiment', sub:'−100→+100'},
    {key:'traf',   label:'Traffic',   sub:'0→100'},
    {key:'promo',  label:'Promo Δ',   sub:'vs baseline'},
    {key:'newsPos',label:'News+%',    sub:'% ข่าวบวก'},
    {key:'verif',  label:'Verified',  sub:'%'},
    {key:'cov',    label:'Coverage',  sub:'หมวด/4'},
    {key:'sector', label:'Sector',    sub:'กลุ่ม'},
    {key:'peerZ',  label:'vs Peers σ',sub:'z-score'},
  ];

  function getRow(stock){
    const sd=data?.stocks?.[stock]||{};
    // sentiment with time decay
    let ws=0,wt=0;
    (sd.sentiments||[]).forEach(e=>{
      const c=CRED[e.source]||2;
      const w=c*Math.max(1,e.feedbackCount||1)*decay(e.date);
      const v=e.sentiment==='positive'?1:e.sentiment==='negative'?-1:0;
      ws+=v*w; wt+=w;
    });
    const sent=wt?Math.round(ws/wt*100):null;
    const traf=calcTrafficLevel(sd.traffic);

    // promo ratio
    const monday=d=>{const dt=new Date(d+'T00:00:00');dt.setDate(dt.getDate()-((dt.getDay()+6)%7));return dt.toISOString().slice(0,10);};
    const byWeek={};
    (sd.prices||[]).forEach(e=>{
      if(!e.promoScore) return;
      const w=monday(e.date);
      if(!byWeek[w]) byWeek[w]={sum:0,n:0};
      byWeek[w].sum+=e.promoScore; byWeek[w].n++;
    });
    const weeks=Object.keys(byWeek).sort();
    let promoRatio=null,promoAlert=false;
    if(weeks.length>=2){
      const cur=byWeek[weeks[weeks.length-1]].sum/byWeek[weeks[weeks.length-1]].n;
      const base=weeks.slice(0,-1).reduce((s,w)=>s+byWeek[w].sum/byWeek[w].n,0)/(weeks.length-1);
      promoRatio=base?cur/base:null;
      promoAlert=promoRatio!==null&&promoRatio>=1.25;
    }

    const news=sd.news||[];
    const newsPos=news.length?Math.round(news.filter(n=>n.sentiment==='positive').length/news.length*100):null;
    const all=[...(sd.prices||[]),...(sd.sentiments||[]),...(sd.traffic||[]),...(sd.news||[])];
    const verif=all.length?Math.round(all.filter(e=>e.verified).length/all.length*100):null;
    const cats=[(sd.prices||[]).length,(sd.sentiments||[]).length,(sd.traffic||[]).length,(sd.news||[]).length].filter(Boolean).length;
    const cov=Math.round(cats/4*100);

    const promoNorm=promoRatio!==null?Math.max(0,Math.round(100-(promoRatio-1)*200)):null;
    const sectorKey=STOCK_SECTOR[stock];
    const sector=SECTORS[sectorKey];
    const sectorStocks=sectorKey==='IT_RETAIL'?SECTORS.IT_RETAIL.stocks:null;
    const peerZ=sectorStocks&&sectorStocks.length>=2?calcPeerZ(data,stock,sectorStocks):null;

    return {
      sent:    {val:sent,    norm:sent!==null?(sent+100)/2:null,      fmt:sent!==null?(sent>0?`+${sent}`:`${sent}`):'—'},
      traf:    {val:traf,    norm:traf,                               fmt:traf!==null?`${traf}/100`:'—'},
      promo:   {val:promoRatio, norm:promoNorm,                       fmt:promoRatio!==null?`${Math.round((promoRatio-1)*100)>0?'+':''}${Math.round((promoRatio-1)*100)}%`:'—',alert:promoAlert},
      newsPos: {val:newsPos, norm:newsPos,                            fmt:newsPos!==null?`${newsPos}%`:'—'},
      verif:   {val:verif,   norm:verif,                              fmt:verif!==null?`${verif}%`:'—'},
      cov:     {val:cov,     norm:cov,                                fmt:`${cats}/4`},
      sector:  {val:sectorKey, norm:null,                             fmt:sectorKey==='IT_RETAIL'?'IT Retail':'Diversified',tag:sectorKey},
      peerZ:   {val:peerZ,   norm:null,                              fmt:peerZ!==null?(peerZ>0?`+${peerZ}σ`:`${peerZ}σ`):'—'},
    };
  }

  const rows=STOCKS.map(s=>({stock:s,m:getRow(s)}));
  const thSt={padding:'8px 10px',fontSize:11,fontWeight:700,color:'#64748b',textAlign:'center',background:'#0f172a',textTransform:'uppercase',letterSpacing:.5};

  return(
    <div style={{background:'#1e293b',border:'1px solid #334155',borderRadius:12,padding:'18px 20px',marginBottom:16,overflowX:'auto'}}>
      <div style={{fontSize:14,fontWeight:700,color:'#f1f5f9',marginBottom:14}}>🌡️ Sector Heatmap</div>
      <table style={{width:'100%',borderCollapse:'separate',borderSpacing:3}}>
        <thead>
          <tr>
            <th style={{...thSt,textAlign:'left',minWidth:80}}>Stock</th>
            {COLS.map(c=>(
              <th key={c.key} style={{...thSt,minWidth:c.key==='sector'?90:80}}>
                <div>{c.label}</div>
                <div style={{fontSize:9,color:'#475569',fontWeight:400,marginTop:1}}>{c.sub}</div>
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {rows.map(({stock,m})=>{
            const color=STOCK_COLOR[stock];
            return(
              <tr key={stock}>
                <td style={{padding:'8px 10px'}}>
                  <div style={{display:'flex',alignItems:'center',gap:7}}>
                    <div style={{width:8,height:8,borderRadius:'50%',background:color,boxShadow:`0 0 6px ${color}`}}/>
                    <span style={{fontWeight:700,color:'#f1f5f9',fontSize:13}}>{stock}</span>
                  </div>
                </td>
                {COLS.map(c=>{
                  const cell=m[c.key];
                  if(c.key==='sector'){
                    const isIT=cell.tag==='IT_RETAIL';
                    return(
                      <td key={c.key} style={{background:'#0f172a',borderRadius:6,padding:'8px 6px',textAlign:'center',border:'2px solid #0f172a'}}>
                        <span style={{fontSize:11,fontWeight:700,padding:'2px 6px',borderRadius:4,
                          background:isIT?'#1e1b4b':'#1c0800',
                          color:isIT?'#818cf8':'#fb923c'}}>
                          {cell.fmt}
                        </span>
                      </td>
                    );
                  }
                  if(c.key==='peerZ'){
                    const z=cell.val;
                    const zColor=z===null?'#475569':z>=1?'#22c55e':z<=-1?'#ef4444':'#94a3b8';
                    return(
                      <td key={c.key} style={{background:'#0f172a',borderRadius:6,padding:'8px 6px',textAlign:'center',border:'2px solid #0f172a'}}>
                        <span style={{fontFamily:'DM Mono',fontSize:13,fontWeight:700,color:zColor}}>{cell.fmt}</span>
                      </td>
                    );
                  }
                  const bg=heatBg(cell.norm);
                  const tc=heatText(cell.norm);
                  return(
                    <td key={c.key} style={{background:bg,borderRadius:6,padding:'8px 6px',textAlign:'center',border:'2px solid #0f172a'}}>
                      <div style={{fontFamily:'DM Mono',fontSize:13,fontWeight:700,color:tc}}>{cell.fmt}</div>
                      {cell.alert&&<div style={{fontSize:9,color:'#fbbf24',marginTop:1}}>⚠️ spike</div>}
                    </td>
                  );
                })}
              </tr>
            );
          })}
        </tbody>
      </table>
      <div style={{display:'flex',gap:16,marginTop:10,fontSize:10,color:'#64748b',flexWrap:'wrap'}}>
        <span style={{color:'#86efac'}}>■ ≥60 ดี</span>
        <span style={{color:'#fde68a'}}>■ 35–59 กลางๆ</span>
        <span style={{color:'#fca5a5'}}>■ &lt;35 ต้องปรับ</span>
        <span style={{color:'#475569'}}>■ — ไม่มีข้อมูล</span>
        <span style={{color:'#818cf8'}}>■ IT Retail</span>
        <span style={{color:'#fb923c'}}>■ Diversified</span>
        <span style={{color:'#94a3b8'}}>σ = z-score vs sector peers (IT Retail เท่านั้น)</span>
      </div>
    </div>
  );
}

// ─── comparison bars ──────────────────────────────────────────────────────────
function CompBars({data}){
  const compositeVals=STOCKS.map(s=>{
    const v=calcSignal(data,s).composite??0;
    return {stock:s,val:v+100,max:200,fmt:v>0?`+${v}`:`${v}`};
  });
  const trafVals=STOCKS.map(s=>{const v=calcTrafficLevel(getSD(data,s).traffic); return {stock:s,val:v??0,max:100,fmt:v!==null?`${v}/100`:'—'};});
  const Row=({stock,val,max,fmt})=>(
    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
      <div style={{width:52,fontSize:11,color:'#94a3b8',textAlign:'right'}}>{stock}</div>
      <div style={{flex:1,background:'#334155',borderRadius:3,height:7}}>
        <div style={{width:`${Math.max(0,Math.min(100,val/max*100))}%`,height:'100%',borderRadius:3,background:STOCK_COLOR[stock],transition:'width .4s'}}/>
      </div>
      <div style={{width:56,fontSize:11,fontFamily:'DM Mono',color:'#e2e8f0',textAlign:'right'}}>{fmt}</div>
    </div>
  );
  return(
    <div style={{background:'#1e293b',border:'1px solid #334155',borderRadius:12,padding:'18px 20px',marginBottom:16}}>
      <div style={{fontSize:14,fontWeight:700,color:'#f1f5f9',marginBottom:4}}>เปรียบเทียบ 3 หุ้น</div>
      <div style={{fontSize:11,color:'#64748b',marginBottom:14}}>
        ⚠️ ADVICE/COM7 = IT Retail peers (เปรียบเทียบตรงได้) · JMART = Diversified (ระวังเปรียบเทียบตรง)
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24}}>
        <div>
          <div style={{fontSize:11,color:'#64748b',marginBottom:8,fontWeight:600}}>Composite Signal (−100 → +100)</div>
          {compositeVals.map(v=><Row key={v.stock} {...v}/>)}
        </div>
        <div>
          <div style={{fontSize:11,color:'#64748b',marginBottom:8,fontWeight:600}}>Traffic Composite (0 → 100)</div>
          {trafVals.map(v=><Row key={v.stock} {...v}/>)}
        </div>
      </div>
    </div>
  );
}

// ─── app ──────────────────────────────────────────────────────────────────────
function App(){
  const [data,setData]=useState(null);
  const [ts,setTs]=useState(new Date());
  const ref=useRef(null);
  const load=()=>{ setData(loadSocial()); setTs(new Date()); };
  useEffect(()=>{ load(); ref.current=setInterval(load,60000); return()=>clearInterval(ref.current); },[]);

  const allItems=STOCKS.flatMap(s=>{const sd=getSD(data,s); return [...(sd.prices||[]),...(sd.sentiments||[]),...(sd.traffic||[]),...(sd.news||[])];});
  const verified=allItems.filter(e=>e.verified).length;
  const verifiedPct=allItems.length?Math.round(verified/allItems.length*100):0;

  return(
    <div style={{maxWidth:1100,margin:'0 auto',padding:'20px 16px'}}>

      {/* topbar */}
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20,flexWrap:'wrap'}}>
        <a href="index.html" style={{color:'#64748b',textDecoration:'none',fontSize:13}}>← Dashboard</a>
        <div style={{flex:1}}>
          <div style={{display:'flex',alignItems:'baseline',gap:10}}>
            <span style={{fontSize:22,fontWeight:700,color:'#f1f5f9'}}>📊 Monitor Board</span>

          </div>
          <div style={{fontSize:11,color:'#475569'}}>รีเฟรชอัตโนมัติทุก 60 วินาที · {ts.toLocaleTimeString('th-TH')}</div>
        </div>
        <div style={{display:'flex',gap:8}}>
          <a href="social.html" style={{background:'#1e293b',border:'1px solid #334155',borderRadius:7,padding:'6px 14px',color:'#94a3b8',textDecoration:'none',fontSize:13}}>📡 Social</a>
          <button onClick={load} style={{background:'#6366f1',border:'none',borderRadius:7,padding:'6px 14px',color:'#fff',cursor:'pointer',fontSize:13}}>↻ รีเฟรช</button>
        </div>
      </div>

      {/* data quality */}
      <div style={{background:'#1e293b',border:'1px solid #334155',borderRadius:8,padding:'10px 16px',marginBottom:14,display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
        <span style={{fontSize:12,color:'#64748b'}}>Data Quality</span>
        <div style={{flex:1,minWidth:120,background:'#334155',borderRadius:3,height:6}}>
          <div style={{width:`${verifiedPct}%`,height:'100%',borderRadius:3,background:'#22c55e'}}/>
        </div>
        <span style={{fontSize:12,fontFamily:'DM Mono',color:'#4ade80'}}>{verifiedPct}% verified</span>
        <span style={{fontSize:12,color:'#64748b'}}>{allItems.length} entries</span>
        <a href="social.html" style={{fontSize:12,color:'#6366f1',textDecoration:'none'}}>→ จัดการ</a>
      </div>

      {/* alerts */}
      <div style={{marginBottom:16}}>
        <div style={{fontSize:12,color:'#64748b',fontWeight:600,marginBottom:8,textTransform:'uppercase',letterSpacing:1}}>⚡ Active Alerts</div>
        <AlertsPanel data={data}/>
      </div>

      {/* IT Retail sector block */}
      <SectorBlock sectorKey="IT_RETAIL" data={data}/>

      {/* Diversified sector block */}
      <SectorBlock sectorKey="DIVERSIFIED" data={data}/>

      {/* sector heatmap */}
      <HeatmapWithSector data={data}/>

      {/* comparison bars */}
      <CompBars data={data}/>

      {/* checklist */}
      <div style={{background:'#1e293b',border:'1px solid #334155',borderRadius:12,padding:'18px 20px'}}>
        <div style={{fontSize:14,fontWeight:700,color:'#f1f5f9',marginBottom:12}}>📋 Daily Monitoring Checklist</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(240px,1fr))',gap:8}}>
          {[
            {icon:'🔥',task:'Promo Δ ใน Heatmap เป็นสีแดงไหม? (>+25%) — margin pressure สำหรับ IT retail',freq:'ทุกวัน'},
            {icon:'📉',task:'Composite Signal <−30? → เปิด Social ดูต้นเหตุ',freq:'ทุกวัน'},
            {icon:'🎯',task:'ADVICE vs COM7 z-score ห่างกัน >1.5σ? — peer divergence signal',freq:'ทุกวัน'},
            {icon:'👥',task:'อัพเดต Traffic Source ≥ 1 แหล่ง/stock',freq:'ทุกสัปดาห์'},
            {icon:'💰',task:'บันทึกราคา iPhone/Samsung ทุกร้าน',freq:'ทุกสัปดาห์'},
            {icon:'📰',task:'เพิ่ม News ≥ 1 ชิ้น/stock + verify',freq:'ทุกสัปดาห์'},

      <div style={{textAlign:'center',color:'#334155',fontSize:11,marginTop:20}}>
        REDCODE Monitor · rc_social_v1 localStorage · ข้อมูลจาก social.html สะท้อนที่นี่ทันที

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
