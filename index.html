  <script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

// ═══════════════════════════════════════════════════
//  DATA
// ═══════════════════════════════════════════════════
const _HARDCODED_PORTS = [
  { id:"pi", label:"พอร์ตหุ้น SJ", broker:"Pi", color:"#f97316", cash:0, holdings:[
    { symbol:"DOHOME",  shares:435618,  avgCost:3.38,  sector:"Commerce",  pe_core:18, pe_fair:22, eps_worst:0, eps_3y:0, div:0, targetPct:0.28 },
    { symbol:"SGC",     shares:1030500, avgCost:1.36,  sector:"Finance",   pe_core:8,  pe_fair:10, eps_worst:0, eps_3y:0, div:0, targetPct:0.27 },
    { symbol:"PR9",     shares:31800,   avgCost:16.80, sector:"Healthcare",pe_core:25, pe_fair:30, eps_worst:0, eps_3y:0, div:0, targetPct:0.10 },
    { symbol:"JMT",     shares:46234,   avgCost:10.90, sector:"Finance",   pe_core:12, pe_fair:15, eps_worst:0, eps_3y:0, div:0, targetPct:0.10 },
    { symbol:"JMART",   shares:52104,   avgCost:8.85,  sector:"Commerce",  pe_core:12, pe_fair:15, eps_worst:0, eps_3y:0, div:0, targetPct:0.09 },
    { symbol:"WASH",    shares:107200,  avgCost:4.08,  sector:"Service",   pe_core:14, pe_fair:18, eps_worst:0, eps_3y:0, div:0, targetPct:0.08 },
    { symbol:"CHAYO",   shares:280973,  avgCost:1.27,  sector:"Finance",   pe_core:10, pe_fair:13, eps_worst:0, eps_3y:0, div:0, targetPct:0.07 },
    { symbol:"SGC-W2",  shares:112800,  avgCost:0.32,  sector:"Warrant",   pe_core:0,  pe_fair:0,  eps_worst:0, eps_3y:0, div:0, targetPct:0.01 },
  ]},
];
// โหลดจาก localStorage ก่อน ถ้าไม่มีให้ใช้ hardcoded แล้ว save ไว้
const INIT_PORTS = (() => {
  try {
    const s = localStorage.getItem('rc_init_ports');
    if (s) return JSON.parse(s);
    if (_HARDCODED_PORTS.length) localStorage.setItem('rc_init_ports', JSON.stringify(_HARDCODED_PORTS));
    return _HARDCODED_PORTS;
  } catch { return _HARDCODED_PORTS; }
})();
// fallback hardcode (ใช้เมื่อ prices.js ไม่มีหรือไม่มีราคา)
const _FALLBACK = { DOHOME:3.38, SGC:1.36, PR9:16.80, JMT:10.90, JMART:8.85, WASH:4.08, CHAYO:1.27, "SGC-W2":0.32 };
// merge prices.js (ถ้ามี) — ข้าม null ให้ใช้ fallback
const _lp = (typeof window!=="undefined")&&window.LATEST_PRICES;
const INIT_PRICES = Object.fromEntries(Object.entries(_FALLBACK).map(([k,v])=>[k,(_lp?.stocks?.[k])??v]));
const INIT_SET   = _lp?.set   ?? 1500.36;
const INIT_SET50 = _lp?.set50 ?? 948.76;

// ── utils ──────────────────────────────────────────
const LS    = "port_v4";
const load  = () => { try { const r=localStorage.getItem(LS); return r?JSON.parse(r):null; } catch { return null; } };
const save  = d => { try { localStorage.setItem(LS,JSON.stringify(d)); } catch {} };
const fmt   = (n,d=2) => (+(n)||0).toLocaleString("th-TH",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtK  = n => Math.abs(n)>=1e6?`฿${fmt(n/1e6)}M`:Math.abs(n)>=1e3?`฿${fmt(n/1e3)}K`:`฿${fmt(n)}`;
const pct   = n => `${n>=0?"+":""}${fmt(n,2)}%`;
const up    = n => n >= 0;
const TODAY = () => new Date().toISOString().slice(0,10);
const MONTHS_EN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDate = dateStr => { const [y,m,d]=dateStr.split("-"); return `${parseInt(d)} ${MONTHS_EN[parseInt(m)-1]} ${y}`; };
const COLORS= ["#6366f1","#f59e0b","#10b981","#f97316","#06b6d4","#e879f9","#3b82f6","#fb923c","#a3e635"];

// อัตราค่าคอมฯ online trading แต่ละโบรค (rate = %, min = ฿)
const BROKER_RATES = {
  pi:   { rate:0.15, min:50,  label:"Pi"   },
  ksec: { rate:0.15, min:50,  label:"KSEC" },
  bls:  { rate:0.15, min:35,  label:"BLS"  },
};
const VAT = 0.07;
const calcComm = (portId, gross, rateOverride, minOverride) => {
  const br = BROKER_RATES[portId] || { rate:0.15, min:50 };
  const rate = (rateOverride !== undefined ? parseFloat(rateOverride) : br.rate) / 100;
  const minC = minOverride !== undefined ? parseFloat(minOverride) : br.min;
  const comm = Math.max(gross * rate, isNaN(minC) ? 0 : minC);
  return { comm, vat: comm * VAT };
};

// Cash ที่แท้จริง = INIT_PORTS.cash + delta จาก txList ทั้งหมด (never double-count)
const deriveCash = (portId, txList) => {
  const base = INIT_PORTS.find(p=>p.id===portId)?.cash ?? 0;
  return txList.reduce((c, tx) => {
    if (tx.portId !== portId) return c;
    if (tx.mode === "cash") return c + (tx.type==="DEPOSIT" ? +(tx.amount||0) : -(tx.amount||0));
    if (tx.type === "SELL") return c + +(tx.netTotal ?? tx.amount ?? 0);
    if (tx.type === "BUY")  return c - +(tx.netTotal ?? tx.amount ?? 0);
    return c;
  }, base);
};

// ── financial calcs ────────────────────────────────
const calcFV       = h => (h.eps_3y&&h.pe_fair)?h.eps_3y*h.pe_fair:0;
const calcWorstFV  = h => h.eps_worst?h.eps_worst*(h.pe_core||h.pe_fair):0;
const calcUpside   = (p,fv)  => fv>0?((fv-p)/p*100):null;
const calcDownside = (p,wfv) => wfv>0?((wfv-p)/p*100):null;

// 3Y annualized CAGR: ((FairValue + div×3) / price)^(1/3) – 1
const calcAnnual3Y = (price, fv, div) => {
  if (!fv||!price||price<=0) return null;
  const terminal = fv + (div||0)*3;
  if (terminal<=0) return null;
  return (Math.pow(terminal/price, 1/3) - 1) * 100;
};

// Risk/Reward = Upside 3Y / |Downside|  (higher = better)
const calcRR = (upside, downside) => {
  if (upside==null||downside==null||downside>=0||upside<=0) return null;
  return upside / Math.abs(downside);
};

const getJudgement = rr => {
  if (rr==null) return null;
  if (rr>7)  return { text:"ซื้อ",    bg:"rgba(22,163,74,0.1)",   color:"#16a34a", border:"rgba(22,163,74,0.25)"  };
  if (rr>=5) return { text:"Monitor", bg:"rgba(245,158,11,0.1)",  color:"#d97706", border:"rgba(245,158,11,0.25)" };
  return           { text:"ช่างมัน", bg:"rgba(148,163,184,0.1)", color:"#94a3b8", border:"rgba(148,163,184,0.25)"};
};

// ═══════════════════════════════════════════════════
//  SVG CHARTS (white-theme)
// ═══════════════════════════════════════════════════
function AreaChartSVG({ data, series, height=160 }) {
  if (!data||data.length<2) return (
    <div style={{height,display:"flex",alignItems:"center",justifyContent:"center",color:"#cbd5e1",fontSize:12}}>
      อัปเดต EOD หลายวันเพื่อดูกราฟ trend
    </div>
  );
  const W=760,H=height,pl=46,pr=8,pt=20,pb=24,iW=W-pl-pr,iH=H-pt-pb;
  const allVals=series.flatMap(s=>data.map(d=>+(d[s.key])||0));
  let mn=Math.min(...allVals),mx=Math.max(...allVals);
  const rng=(mx-mn)||1; mn-=rng*.1; mx+=rng*.1; const R=mx-mn;
  const xp=i=>pl+(i/(data.length-1))*iW, yp=v=>pt+(1-(v-mn)/R)*iH;
  const mkPath=key=>data.map((d,i)=>`${i===0?"M":"L"}${xp(i).toFixed(1)},${yp(+(d[key])||0).toFixed(1)}`).join(" ");
  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{display:"block",height}}>
      <defs>
        {series.filter(s=>s.fill).map(s=>(
          <linearGradient key={s.key} id={`g${s.key}`} x1="0" y1="0" x2="0" y2="1">
            <stop offset="5%"  stopColor={s.stroke} stopOpacity={.2}/>
            <stop offset="95%" stopColor={s.stroke} stopOpacity={0}/>
          </linearGradient>
        ))}
      </defs>
      {[0,.25,.5,.75,1].map((t,i)=>{ const v=mn+R*t,y=yp(v); return (
        <g key={i}>
          <line x1={pl} y1={y} x2={pl+iW} y2={y} stroke="#e2e8f0" strokeDasharray={t===0||t===1?"":"3 3"}/>
          <text x={pl-5} y={y+3.5} textAnchor="end" fill="#cbd5e1" fontSize={10}>{v.toFixed(1)}%</text>
        </g>
      ); })}
      {data.map((d,i)=>{ const step=Math.ceil(data.length/6); if(i%step!==0&&i!==data.length-1)return null; return <text key={i} x={xp(i)} y={H-2} textAnchor="middle" fill="#94a3b8" fontSize={10}>{d.date}</text>; })}
      {series.map(s=>(
        <g key={s.key}>
          {s.fill&&<path d={`${mkPath(s.key)} L${xp(data.length-1)},${pt+iH} L${pl},${pt+iH} Z`} fill={`url(#g${s.key})`}/>}
          <path d={mkPath(s.key)} fill="none" stroke={s.stroke} strokeWidth={s.sw||1.5} strokeDasharray={s.dash||""} strokeLinecap="round" strokeLinejoin="round"/>
        </g>
      ))}
      {series.map((s,i)=>(
        <g key={s.key} transform={`translate(${pl+i*80},8)`}>
          <line x1={0} y1={5} x2={18} y2={5} stroke={s.stroke} strokeWidth={2} strokeDasharray={s.dash||""}/>
          <text x={22} y={9} fill="#64748b" fontSize={10}>{s.name}</text>
        </g>
      ))}
    </svg>
  );
}

function PieChartSVG({ data, size=110, innerR=30, outerR=50 }) {
  const cx=size/2,cy=size/2,total=data.reduce((a,d)=>a+(d.value||0),0);
  if(!total)return null;
  let angle=-Math.PI/2;
  const arcs=data.map((d,i)=>{ const sw=(d.value/total)*2*Math.PI,end=angle+sw,x1=cx+outerR*Math.cos(angle),y1=cy+outerR*Math.sin(angle),x2=cx+outerR*Math.cos(end),y2=cy+outerR*Math.sin(end),ix1=cx+innerR*Math.cos(end),iy1=cy+innerR*Math.sin(end),ix2=cx+innerR*Math.cos(angle),iy2=cy+innerR*Math.sin(angle),lg=sw>Math.PI?1:0,path=`M${x1},${y1}A${outerR},${outerR} 0 ${lg} 1 ${x2},${y2}L${ix1},${iy1}A${innerR},${innerR} 0 ${lg} 0 ${ix2},${iy2}Z`; angle=end; return{...d,path,color:COLORS[i%COLORS.length]}; });
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {arcs.map((a,i)=><path key={i} d={a.path} fill={a.color} stroke="#fff" strokeWidth={2}><title>{a.name}: {fmt((a.value/total)*100,1)}%</title></path>)}
    </svg>
  );
}

function BarChartSVG({ data, height=120 }) {
  if(!data||!data.length)return null;
  const W=760,H=height,pl=52,pr=8,pt=8,pb=22,iW=W-pl-pr,iH=H-pt-pb;
  const maxAbs=Math.max(...data.map(d=>Math.abs(d.pnl||0)),1),bW=Math.max(12,(iW/data.length)*.6),step=iW/data.length;
  const y0=pt+iH/2,ys=v=>(v/maxAbs)*(iH/2);
  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{display:"block",height}}>
      {[-maxAbs,-maxAbs/2,0,maxAbs/2,maxAbs].map((v,i)=>{ const y=y0-ys(v),lbl=Math.abs(v)>=1000?`${(v/1000).toFixed(0)}K`:v.toFixed(0); return (
        <g key={i}>
          <line x1={pl} y1={y} x2={pl+iW} y2={y} stroke={v===0?"#cbd5e1":"#f1f5f9"} strokeDasharray={v!==0?"3 3":""}/>
          <text x={pl-4} y={y+3.5} textAnchor="end" fill="#cbd5e1" fontSize={10}>{lbl}</text>
        </g>
      ); })}
      {data.map((d,i)=>{ const val=d.pnl||0,bH=Math.max(Math.abs(ys(val)),1),x=pl+i*step+(step-bW)/2,y=val>=0?y0-bH:y0; return (
        <g key={i}>
          <rect x={x} y={y} width={bW} height={bH} fill={val>=0?"#10b981":"#f43f5e"} rx={3} opacity={.85}><title>{d.name}: {val>=0?"+":""}{(val/1000).toFixed(1)}K</title></rect>
          <text x={x+bW/2} y={H-3} textAnchor="middle" fill="#94a3b8" fontSize={10}>{d.name}</text>
        </g>
      ); })}
    </svg>
  );
}

// ── EditCell ───────────────────────────────────────
function EditCell({ onSave, val, display, type="number", w=80 }) {
  const [editing,setEditing]=useState(false);
  const [v,setV]=useState(String(val).replace(/,/g,""));
  const IS={background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:6,color:"#1e293b",padding:"3px 6px",fontSize:11,fontFamily:"'DM Mono',monospace",outline:"none",width:w};
  const save=()=>{ onSave(v); setEditing(false); };
  if(!editing)return <span onClick={()=>{setV(String(val).replace(/,/g,""));setEditing(true);}} style={{cursor:"pointer",borderBottom:"1px dashed #cbd5e1",fontFamily:"'DM Mono',monospace"}}>{display!==undefined?display:val}</span>;
  return <input autoFocus type={type} value={v} style={IS} onChange={e=>setV(e.target.value)} onBlur={save} onKeyDown={e=>e.key==="Enter"&&save()}/>;
}

// ═══════════════════════════════════════════════════
//  LOCAL BACKUP / RESTORE (offline — ไม่พึ่ง cloud)
//  ครอบคลุมทั้งพอร์ตหุ้น (rc_init_ports + port_v4) และข้อมูล SJ
// ═══════════════════════════════════════════════════
function sjFullBackup() {
  return {
    _app: "SJ_COMPANY", _ver: 1, _date: new Date().toISOString(),
    ports: JSON.parse(localStorage.getItem("rc_init_ports") || "[]"),
    ls:    JSON.parse(localStorage.getItem("port_v4") || "null"),
    sj:    JSON.parse(localStorage.getItem("sj_finance_v1") || "null"),
  };
}
function downloadBackup() {
  const blob = new Blob([JSON.stringify(sjFullBackup(), null, 2)], { type: "application/json" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href = url; a.download = `sj_company_backup_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function restoreBackup(obj) {
  if (!obj || obj._app !== "SJ_COMPANY") throw new Error("ไฟล์สำรองไม่ถูกต้อง");
  if (obj.ports) localStorage.setItem("rc_init_ports", JSON.stringify(obj.ports));
  if (obj.ls)    localStorage.setItem("port_v4",       JSON.stringify(obj.ls));
  if (obj.sj)    localStorage.setItem("sj_finance_v1", JSON.stringify(obj.sj));
}

// ═══════════════════════════════════════════════════
//  SETUP WIZARD (first-run บนอุปกรณ์ใหม่)
// ═══════════════════════════════════════════════════
function SetupWizard() {
  const TMPL = [
    {id:"pi",   label:"Pi",   broker:"Pi",   color:"#6366f1"},
    {id:"ksec", label:"KSEC", broker:"KSEC", color:"#f59e0b"},
    {id:"bls",  label:"BLS",  broker:"BLS",  color:"#10b981"},
  ];
  const blank = () => ({symbol:"",shares:"",avgCost:""});
  const [tab,  setTab]  = React.useState(0);
  const [mode, setMode] = React.useState("form");
  const [data, setData] = React.useState(TMPL.map(p=>({...p,cash:"0",holdings:[blank()]})));
  const [json, setJson] = React.useState("");
  const [err,  setErr]  = React.useState("");

  const updH   = (pi,hi,f,v) => setData(d=>d.map((p,i)=>i===pi?{...p,holdings:p.holdings.map((h,j)=>j===hi?{...h,[f]:v}:h)}:p));
  const addRow = pi => setData(d=>d.map((p,i)=>i===pi?{...p,holdings:[...p.holdings,blank()]}:p));
  const delRow = (pi,hi) => setData(d=>d.map((p,i)=>i===pi?{...p,holdings:p.holdings.filter((_,j)=>j!==hi)}:p));
  const updCash= (pi,v) => setData(d=>d.map((p,i)=>i===pi?{...p,cash:v}:p));

  const saveForm = () => {
    const ports = data.map(p=>({
      id:p.id, label:p.label, broker:p.broker, color:p.color,
      cash:parseFloat(p.cash)||0,
      holdings:p.holdings.filter(h=>h.symbol.trim()).map(h=>({
        symbol:h.symbol.trim().toUpperCase(), shares:parseInt(h.shares)||0,
        avgCost:parseFloat(h.avgCost)||0, sector:"—",
        pe_core:0, pe_fair:0, eps_worst:0, eps_3y:0, div:0, targetPct:0
      }))
    }));
    if(ports.every(p=>p.holdings.length===0)){setErr("เพิ่มหุ้นอย่างน้อย 1 ตัว");return;}
    localStorage.setItem('rc_init_ports',JSON.stringify(ports));
    window.location.reload();
  };
  const saveJson = () => {
    try {
      const d=JSON.parse(json);
      if(!Array.isArray(d)||d.length===0) throw new Error("ต้องเป็น array");
      localStorage.setItem('rc_init_ports',JSON.stringify(d));
      window.location.reload();
    } catch(e){setErr(e.message);}
  };

  const S = {
    card:{background:'#fff',borderRadius:16,padding:'20px 16px',maxWidth:480,width:'100%',boxShadow:'0 2px 16px #0001'},
    inp:{width:'100%',border:'1px solid #e2e8f0',borderRadius:7,padding:'7px 8px',fontSize:13,fontFamily:'inherit',boxSizing:'border-box'},
    btn:(c,full)=>({background:c,color:'#fff',border:'none',borderRadius:9,padding:full?'12px':'7px 12px',fontSize:full?15:13,fontWeight:700,cursor:'pointer',width:full?'100%':'auto'}),
  };
  const p = data[tab];
  return (
    <div style={{minHeight:'100vh',background:'#f8fafc',padding:'16px 12px',fontFamily:'system-ui,sans-serif',display:'flex',justifyContent:'center',alignItems:'flex-start'}}>
      <div style={S.card}>
        <div style={{textAlign:'center',marginBottom:16}}>
          <div style={{fontSize:26}}>📊</div>
          <h2 style={{margin:'2px 0 12px',color:'#1e293b',fontSize:18}}>ตั้งค่า Portfolio</h2>
          <div style={{display:'flex',gap:4}}>
            {TMPL.map((t,i)=>(
              <button key={t.id} onClick={()=>setTab(i)} style={{flex:1,background:tab===i?t.color:'#f1f5f9',color:tab===i?'#fff':'#64748b',border:'none',borderRadius:8,padding:'8px 0',fontSize:13,fontWeight:700,cursor:'pointer'}}>{t.label}</button>
            ))}
          </div>
        </div>

        {/* Restore — โหลดจากไฟล์สำรองในเครื่อง */}
        <label style={{width:'100%',background:'#fff',color:'#374151',border:'1px solid #e2e8f0',borderRadius:9,padding:'11px',fontSize:14,fontWeight:600,cursor:'pointer',marginBottom:12,display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
          📂 โหลดจากไฟล์สำรอง (.json)
          <input type="file" accept=".json,application/json" style={{display:'none'}} onChange={e=>{
            const f=e.target.files[0]; if(!f) return;
            const r=new FileReader();
            r.onload=ev=>{ try{ restoreBackup(JSON.parse(ev.target.result)); window.location.reload(); }catch(err){ setErr('❌ '+err.message); } };
            r.readAsText(f);
          }}/>
        </label>

        {mode==="form" ? (<>
          <div style={{marginBottom:12}}>
            <label style={{fontSize:11,color:'#64748b',fontWeight:700}}>เงินสด (฿)</label>
            <input type="number" value={p.cash} onChange={e=>updCash(tab,e.target.value)} style={{...S.inp,marginTop:3}} placeholder="0"/>
          </div>

        </>)}
      </div>
    </div>
  );
}

const TH_BRACKETS = [[150000,0],[300000,0.05],[500000,0.10],[750000,0.15],[1000000,0.20],[2000000,0.25],[5000000,0.30],[Infinity,0.35]];
function calcThaiTax(net){ let tax=0,lower=0; for(const [upper,rate] of TH_BRACKETS){ if(net>lower){ tax+=(Math.min(net,upper)-lower)*rate; lower=upper; } else break; } return tax; }
// อัตราภาษีของเงินได้สุทธิบาทถัดไป (marginal rate)
function marginalRate(net){ let lower=0; for(const [upper,rate] of TH_BRACKETS){ if(net<=upper) return rate; lower=upper; } return 0.35; }

            <input placeholder="ชื่อกองทุน" value={buyForm.fund} onChange={e=>setBuyForm(f=>({...f,fund:e.target.value}))} style={sjInp}/>
            <input placeholder="ยอดซื้อ" value={buyForm.amount} onChange={e=>setBuyForm(f=>({...f,amount:e.target.value}))} style={sjInp}/>
            <button onClick={addBuy} style={sjBtn("#16a34a")}>เพิ่ม</button>
          </div>
        )}
        {buyYears.map(y=>{ const list=fundBuys.filter(b=>b.year===y); const sum=list.reduce((a,b)=>a+(+b.amount||0),0); return (
          <div key={y} style={{marginBottom:12}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>

              <span style={{marginLeft:"auto",fontFamily:"'DM Mono',monospace",fontWeight:700}}>รวม {fmt(sum)} ฿</span>
            </div>
            {list.map(b=>(
              <div key={b.id} className="rh" style={{display:"grid",gridTemplateColumns:"80px 1fr 120px auto",gap:8,alignItems:"center",padding:"4px",fontSize:13}}>
                <span style={{fontWeight:700,color:FUND_CAT_COLOR[b.cat]}}>{b.cat}</span>
                <span>{b.fund}</span>
                <span style={{textAlign:"right",fontFamily:"'DM Mono',monospace"}}>{fmt(b.amount)} ฿</span>
                <button onClick={()=>delBuy(b.id)} style={sjDel}>ลบ</button>
              </div>
            ))}
          </div>
        );})}
      </div>
    </>
  );
}

// ═══════════════ CASHFLOW (รายรับ-รายจ่าย) ═══════════════
function CashflowView({ income, setIncome, expenses, setExpenses, invest, setInvest, year, setYear }) {
  const [incAdd,setIncAdd]=useState(false);
  const [expForm,setExpForm]=useState({name:"",amount:"",group:EXP_GROUPS[0]});
  const [expAdd,setExpAdd]=useState(false);
  const [vForm,setVForm]=useState({name:"",amount:""});
  const [vAdd,setVAdd]=useState(false);

  const inY = arr => arr.filter(x=>x.year===year);
  const incY=inY(income), expY=inY(expenses), vY=inY(invest);
  const incTotal=incY.reduce((a,i)=>a+(+i.amount||0),0);
  const expTotal=expY.reduce((a,e)=>a+(+e.amount||0),0);
  const vTotal=vY.reduce((a,v)=>a+(+v.amount||0),0);
  const balance=incTotal-expTotal;
  const savingRate=incTotal>0?(balance+vTotal)/incTotal*100:0;

  const addInc=()=>{ setIncome(p=>[...p,{id:"i"+Date.now(),year,name:"รายรับใหม่",amount:0}]); setIncAdd(false); };
  const editInc=(id,k,v)=>setIncome(p=>p.map(i=>i.id!==id?i:{...i,[k]:(k==="amount")?(+v||0):v}));
  const delInc=id=>setIncome(p=>p.filter(i=>i.id!==id));
  const addExp=()=>{ if(!expForm.name)return; setExpenses(p=>[...p,{id:"e"+Date.now(),year,...expForm,amount:+expForm.amount||0}]); setExpForm({name:"",amount:"",group:EXP_GROUPS[0]}); setExpAdd(false); };
  const editExp=(id,k,v)=>setExpenses(p=>p.map(e=>e.id!==id?e:{...e,[k]:(k==="amount")?(+v||0):v}));
  const delExp=id=>setExpenses(p=>p.filter(e=>e.id!==id));
  const addV=()=>{ if(!vForm.name)return; setInvest(p=>[...p,{id:"v"+Date.now(),year,...vForm,amount:+vForm.amount||0}]); setVForm({name:"",amount:""}); setVAdd(false); };
  const editV=(id,k,v)=>setInvest(p=>p.map(x=>x.id!==id?x:{...x,[k]:(k==="amount")?(+v||0):v}));
  const delV=id=>setInvest(p=>p.filter(x=>x.id!==id));

  const expByGroup=EXP_GROUPS.map(g=>({name:g,value:expY.filter(e=>e.group===g).reduce((a,e)=>a+(+e.amount||0),0)})).filter(d=>d.value>0);

  return (
    <>
      {/* year selector */}
      <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:14}}>
        <span style={{fontSize:13,color:SC.sub,fontWeight:600}}>ปีภาษี:</span>
        {SJ_YEARS.map(y=>(
          <button key={y} onClick={()=>setYear(y)} style={{...sjBtn(year===y?"#6366f1":"#f1f5f9"),color:year===y?"#fff":SC.sub,fontWeight:700}}>{y} ({(+y)-543})</button>
        ))}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(170px,1fr))",gap:12,marginBottom:16}}>
        <StatCard lbl="รายรับทั้งปี" val={fmtK(incTotal)} sub={`≈ ${fmtK(incTotal/12)}/เดือน`} acc={SC.up} clr={SC.up} icon="💰"/>
        <StatCard lbl="รายจ่ายทั้งปี" val={fmtK(expTotal)} sub={`≈ ${fmtK(expTotal/12)}/เดือน`} acc={SC.dn} clr={SC.dn} icon="💸"/>
        <StatCard lbl="คงเหลือ (Balance)" val={`${balance>=0?"+":""}${fmtK(Math.abs(balance))}`} sub={`รายรับ − รายจ่าย`} acc={balance>=0?SC.up:SC.dn} clr={balance>=0?SC.up:SC.dn} icon={balance>=0?"🟢":"🔴"}/>
        <StatCard lbl="เงินลงทุน/ออม" val={fmtK(vTotal)} sub={`อัตราออม+ลงทุน ${fmt(savingRate,1)}%`} acc="#6366f1" icon="🌱"/>
      </div>

      <div className="sj-2col" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:16}}>
        {/* รายรับ */}
        <div style={{...sjCard}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <SectionTitle icon="💰" title="รายรับ" sub={`ปี ${year}`}/>
            <button onClick={addInc} style={sjBtn("#16a34a")}>+ เพิ่ม</button>
          </div>
          {incY.map(i=>(
            <div key={i.id} className="rh" style={{display:"grid",gridTemplateColumns:"1fr 140px auto",gap:8,alignItems:"center",padding:"6px 4px",fontSize:13}}>
              <input value={i.name} onChange={e=>editInc(i.id,"name",e.target.value)} style={{...sjInp,border:"1px solid transparent",background:"transparent",fontWeight:600}}/>
              <input value={i.amount} onChange={e=>editInc(i.id,"amount",e.target.value)} style={{...sjInp,textAlign:"right"}}/>
              <button onClick={()=>delInc(i.id)} style={sjDel}>ลบ</button>
            </div>
          ))}
          <div style={{display:"flex",justifyContent:"space-between",borderTop:`2px solid ${SC.up}`,marginTop:8,paddingTop:8,fontWeight:800}}>
            <span>รวมรายรับ</span><span style={{fontFamily:"'DM Mono',monospace",color:SC.up}}>{fmt(incTotal)} ฿</span>
          </div>
        </div>

        {/* donut รายจ่ายตามกลุ่ม */}
        <div style={{...sjCard}}>
          <SectionTitle icon="🍩" title="สัดส่วนรายจ่าย" sub={`รวม ${fmtK(expTotal)}`}/>
          <div style={{display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
            <PieChartSVG data={expByGroup} size={140} innerR={44} outerR={66}/>
            <div style={{flex:1,minWidth:160}}>
              {expByGroup.map((d,i)=>{ const p=expTotal>0?d.value/expTotal*100:0; return (
                <div key={d.name} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 0",fontSize:13}}>
                  <span style={{width:10,height:10,borderRadius:3,background:EXP_GROUP_COLOR[d.name]||COLORS[i],flexShrink:0}}/>
                  <span style={{flex:1}}>{d.name}</span>
                  <span style={{fontFamily:"'DM Mono',monospace",fontWeight:700}}>{fmt(d.value,0)}</span>
                  <span style={{width:48,textAlign:"right",color:SC.muted}}>{fmt(p,0)}%</span>
                </div>
              );})}
            </div>
          </div>
        </div>
      </div>

      {/* รายจ่าย แยกกลุ่ม */}
      <div style={{...sjCard,marginBottom:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <SectionTitle icon="💸" title="รายจ่าย แยกหมวด" sub={`ปี ${year}`}/>
          <button onClick={()=>setExpAdd(v=>!v)} style={sjBtn(expAdd?"#94a3b8":"#dc2626")}>{expAdd?"ยกเลิก":"+ เพิ่มรายการ"}</button>
        </div>
        {expAdd&&(
          <div style={{display:"grid",gridTemplateColumns:"1fr 200px 130px auto",gap:6,marginBottom:10}}>
            <input placeholder="ชื่อรายการ" value={expForm.name} onChange={e=>setExpForm(f=>({...f,name:e.target.value}))} style={sjInp}/>
            <select value={expForm.group} onChange={e=>setExpForm(f=>({...f,group:e.target.value}))} style={sjInp}>{EXP_GROUPS.map(g=><option key={g}>{g}</option>)}</select>
            <input placeholder="ยอดทั้งปี" value={expForm.amount} onChange={e=>setExpForm(f=>({...f,amount:e.target.value}))} style={sjInp}/>
            <button onClick={addExp} style={sjBtn("#dc2626")}>เพิ่ม</button>
          </div>
        )}
        {EXP_GROUPS.filter(g=>expY.some(e=>e.group===g)).map(g=>{
          const list=expY.filter(e=>e.group===g); const sum=list.reduce((a,e)=>a+(+e.amount||0),0);
          return (
            <div key={g} style={{marginBottom:12}}>
              <div style={{display:"flex",alignItems:"center",gap:8,borderBottom:`2px solid ${EXP_GROUP_COLOR[g]}`,paddingBottom:4,marginBottom:6}}>
                <span style={{width:10,height:10,borderRadius:3,background:EXP_GROUP_COLOR[g]}}/>
                <span style={{fontWeight:800,fontSize:14}}>{g}</span>
                <span style={{marginLeft:"auto",fontFamily:"'DM Mono',monospace",fontWeight:700}}>{fmt(sum)} ฿</span>
                <span style={{fontSize:11,color:SC.muted}}>≈{fmt(sum/12,0)}/ด.</span>
              </div>
              {list.map(e=>(
                <div key={e.id} className="rh" style={{display:"grid",gridTemplateColumns:"1fr 140px 90px auto",gap:8,alignItems:"center",padding:"5px 4px",fontSize:13}}>
                  <input value={e.name} onChange={ev=>editExp(e.id,"name",ev.target.value)} style={{...sjInp,border:"1px solid transparent",background:"transparent",fontWeight:600}}/>
                  <input value={e.amount} onChange={ev=>editExp(e.id,"amount",ev.target.value)} style={{...sjInp,textAlign:"right"}}/>
                  <span style={{textAlign:"right",fontSize:11,color:SC.muted,fontFamily:"'DM Mono',monospace"}}>{fmt((+e.amount||0)/12,0)}/ด.</span>
                  <button onClick={()=>delExp(e.id)} style={sjDel}>ลบ</button>
                </div>
              ))}
            </div>
          );
        })}
        <div style={{display:"flex",justifyContent:"space-between",borderTop:`2px solid ${SC.dn}`,marginTop:6,paddingTop:8,fontWeight:800}}>
          <span>รวมรายจ่าย</span><span style={{fontFamily:"'DM Mono',monospace",color:SC.dn}}>{fmt(expTotal)} ฿</span>
        </div>
      </div>

      {/* เงินลงทุน/ออม */}
      <div style={{...sjCard}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <SectionTitle icon="🌱" title="เงินลงทุน / เงินออม" sub="แยกจากค่าใช้จ่าย"/>
          <button onClick={()=>setVAdd(v=>!v)} style={sjBtn(vAdd?"#94a3b8":"#6366f1")}>{vAdd?"ยกเลิก":"+ เพิ่ม"}</button>
        </div>
        {vAdd&&(
          <div style={{display:"grid",gridTemplateColumns:"1fr 140px auto",gap:6,marginBottom:10}}>
            <input placeholder="ชื่อรายการ" value={vForm.name} onChange={e=>setVForm(f=>({...f,name:e.target.value}))} style={sjInp}/>
            <input placeholder="ยอดทั้งปี" value={vForm.amount} onChange={e=>setVForm(f=>({...f,amount:e.target.value}))} style={sjInp}/>
            <button onClick={addV} style={sjBtn("#6366f1")}>เพิ่ม</button>
          </div>
        )}
        {vY.map(v=>(
          <div key={v.id} className="rh" style={{display:"grid",gridTemplateColumns:"1fr 140px auto",gap:8,alignItems:"center",padding:"5px 4px",fontSize:13}}>
            <input value={v.name} onChange={e=>editV(v.id,"name",e.target.value)} style={{...sjInp,border:"1px solid transparent",background:"transparent",fontWeight:600}}/>
            <input value={v.amount} onChange={e=>editV(v.id,"amount",e.target.value)} style={{...sjInp,textAlign:"right"}}/>

          <span>รวมเงินลงทุน/ออม</span><span style={{fontFamily:"'DM Mono',monospace",color:"#6366f1"}}>{fmt(vTotal)} ฿</span>
        </div>
      </div>
    </>
  );
}

// ═══════════════ TAX (ภาษีเงินได้บุคคลธรรมดา) ═══════════════
function TaxView({ tax, setTax }) {
  const [dAdd,setDAdd]=useState(false);
  const [dForm,setDForm]=useState({name:"",amount:""});
  const setF=(k,v)=>setTax(t=>({...t,[k]:(+v||0)}));
  const editD=(id,k,v)=>setTax(t=>({...t,deductions:t.deductions.map(d=>d.id!==id?d:{...d,[k]:(k==="amount")?(+v||0):v})}));
  const delD=id=>setTax(t=>({...t,deductions:t.deductions.filter(d=>d.id!==id)}));
  const addD=()=>{ if(!dForm.name)return; setTax(t=>({...t,deductions:[...t.deductions,{id:"d"+Date.now(),name:dForm.name,amount:+dForm.amount||0}]})); setDForm({name:"",amount:""}); setDAdd(false); };

  // ── คำนวณ ──
  const gross=+tax.grossIncome||0, exempt=+tax.exempt||0, wht=+tax.wht||0;
  const afterExempt=gross-exempt;
  const expenseDeduct=Math.min(afterExempt*0.5,100000); // ค่าใช้จ่าย 50% สูงสุด 100,000
  const afterExpense=afterExempt-expenseDeduct;
  const deductTotal=tax.deductions.reduce((a,d)=>a+(+d.amount||0),0);
  const net=Math.max(0,afterExpense-deductTotal);
  const taxDue=calcThaiTax(net);
  const payMore=taxDue-wht; // >0 จ่ายเพิ่ม, <0 ได้คืน
  const mRate=marginalRate(net);
  const effRate=gross>0?taxDue/gross*100:0;
  const inst=payMore>=3000?[Math.ceil(payMore/3*100)/100,Math.floor(payMore/3*100)/100,Math.floor(payMore/3*100)/100]:null;
  if(inst){ inst[0]=payMore-inst[1]-inst[2]; } // งวดแรกรับเศษ

  const Row=({lbl,val,bold,clr,minus})=>(
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:`1px solid ${SC.border}`,fontSize:bold?15:13}}>
      <span style={{color:bold?SC.text:SC.sub,fontWeight:bold?800:500}}>{lbl}</span>
      <span style={{fontFamily:"'DM Mono',monospace",fontWeight:bold?800:600,color:clr||SC.text}}>{minus&&val>0?"−":""}{fmt(val)}</span>
    </div>
  );

  return (
    <>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:12,marginBottom:16}}>
        <StatCard lbl="เงินได้สุทธิ" val={fmtK(net)} sub={`ฐานภาษีขั้น ${fmt(mRate*100,0)}%`} acc="#6366f1" icon="🧮"/>
        <StatCard lbl="ภาษีที่ต้องเสียทั้งปี" val={fmtK(taxDue)} sub={`อัตราเฉลี่ย ${fmt(effRate,2)}% ของเงินได้`} acc="#f59e0b" clr="#b45309" icon="🇹🇭"/>
        <StatCard lbl="หัก ณ ที่จ่ายแล้ว" val={fmtK(wht)} sub="ภาษีที่ถูกหักระหว่างปี" acc="#0ea5e9" icon="🧾"/>
        <StatCard lbl={payMore>=0?"ต้องจ่ายเพิ่ม":"ได้คืนภาษี"} val={fmtK(Math.abs(payMore))} sub={payMore>=0?"ชำระตอนยื่นแบบ":"ขอคืนได้"} acc={payMore>=0?SC.dn:SC.up} clr={payMore>=0?SC.dn:SC.up} icon={payMore>=0?"💰":"🎉"}/>
      </div>

      <div className="sj-2col" style={{display:"grid",gridTemplateColumns:"1.1fr 1fr",gap:16}}>
        {/* การคำนวณ */}
        <div style={{...sjCard}}>
          <SectionTitle icon="🧮" title={`การคำนวณภาษี — ปีภาษี ${tax.year}`} sub="ภ.ง.ด.91"/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 150px",gap:8,alignItems:"center",marginBottom:6}}>
            <span style={{fontSize:13,color:SC.sub}}>เงินเดือน/ค่าจ้าง ทั้งปี (40(1))</span>
            <input value={tax.grossIncome} onChange={e=>setF("grossIncome",e.target.value)} style={{...sjInp,textAlign:"right"}}/>
            <span style={{fontSize:13,color:SC.sub}}>หัก เงินได้ยกเว้น (PVD ส่วนเกิน ฯลฯ)</span>
            <input value={tax.exempt} onChange={e=>setF("exempt",e.target.value)} style={{...sjInp,textAlign:"right"}}/>
          </div>
          <Row lbl="คงเหลือ" val={afterExempt} clr={SC.text}/>
          <Row lbl="หัก ค่าใช้จ่าย (50% สูงสุด 100,000)" val={expenseDeduct} clr={SC.dn} minus/>
          <Row lbl="คงเหลือหลังหักค่าใช้จ่าย" val={afterExpense}/>
          <Row lbl={`หัก ค่าลดหย่อนรวม (${tax.deductions.length} รายการ)`} val={deductTotal} clr={SC.dn} minus/>
          <Row lbl="เงินได้สุทธิ (ฐานภาษี)" val={net} bold/>
          <Row lbl="ภาษีคำนวณจากเงินได้สุทธิ" val={taxDue} bold clr="#b45309"/>
          <Row lbl="หัก ภาษีหัก ณ ที่จ่าย" val={wht} clr={SC.up} minus/>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 0 2px",fontSize:16}}>
            <span style={{fontWeight:800}}>{payMore>=0?"ภาษีที่ต้องชำระเพิ่ม":"ภาษีที่ชำระไว้เกิน (ขอคืนได้)"}</span>
            <span style={{fontFamily:"'DM Mono',monospace",fontWeight:800,color:payMore>=0?SC.dn:SC.up,fontSize:20}}>{fmt(Math.abs(payMore))} ฿</span>
          </div>
          {inst&&(
            <div style={{marginTop:12,background:"#fef3c7",borderRadius:10,padding:"10px 12px"}}>
              <div style={{fontSize:12,fontWeight:700,color:"#b45309",marginBottom:6}}>📅 ผ่อนชำระได้ 3 งวด (ภาษี ≥ 3,000 บาท)</div>
              {inst.map((v,i)=>(
                <div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:13,padding:"2px 0"}}>
                  <span>งวดที่ {i+1}</span><span style={{fontFamily:"'DM Mono',monospace",fontWeight:600}}>{fmt(v)} ฿</span>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* ค่าลดหย่อน */}
        <div style={{...sjCard}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <SectionTitle icon="📋" title="ค่าลดหย่อน" sub={`รวม ${fmtK(deductTotal)}`}/>

// ═══════════════════════════════════════════════════
function App() {
  const stored=load();
  const storedTxList = stored?.txList ?? [];
  // first-run: ถ้าไม่มีพอร์ตเลย → ให้ SetupWizard จัดการ
  if (INIT_PORTS.length === 0 && (!stored?.ports || stored.ports.length === 0)) return <SetupWizard />;
  // sync label/broker + คำนวณ cash จาก txList ตั้งแต่ต้น (ไม่เก็บ cash ใน localStorage)
  const initPorts = (stored?.ports ?? INIT_PORTS).map(p => {
    const init = INIT_PORTS.find(i=>i.id===p.id);
    return {...p, label:init?.label??p.label, broker:init?.broker??p.broker, cash:deriveCash(p.id, storedTxList)};
  });
  const [ports,     setPorts]    = useState(initPorts);
  const [prices,    setPrices]   = useState(stored?.prices  ?? INIT_PRICES);
  const [setP,      setSetP]     = useState(stored?.setP    ?? INIT_SET);
  const [set50P,    setSet50P]   = useState(stored?.set50P  ?? INIT_SET50);
  const [setPE,     setSetPE]    = useState(stored?.setPE   ?? 0);
  const [set50PE,   setSet50PE]  = useState(stored?.set50PE ?? 0);
  const [hist,      setHist]     = useState(stored?.hist    ?? [{date:TODAY(),prices:{...INIT_PRICES},set:INIT_SET,set50:INIT_SET50}]);
  const [lastUpd,   setLastUpd]  = useState(stored?.lastUpd ?? TODAY());
  const [tab,       setTab]      = useState("overview");
  const [selPort,   setSelPort]  = useState("all");
  const [modal,     setModal]    = useState(null);
  const [editP,     setEditP]    = useState({});
  const [eSet,      setESet]     = useState(INIT_SET);
  const [eSet50,    setESet50]   = useState(INIT_SET50);
  const [txForm,    setTxForm]   = useState({portId:"pi",mode:"stock",type:"BUY",symbol:"",shares:"",price:"",amount:"",note:"",date:TODAY(),commRate:"0.15",commMin:"50",_editId:null});
  const [txList,    setTxList]   = useState(stored?.txList ?? []);
  const [statusMsg, setStatusMsg]= useState("");
  const [fetchSt,   setFetchSt]  = useState("idle");
  const [addForm,   setAddForm]  = useState({symbol:"",shares:"",avgCost:""});
  const [watchList, setWatchList]= useState(stored?.watchList ?? []);
  const [wlAddForm, setWlAddForm]= useState({symbol:"",eps_worst:"",eps_3y:"",pe_core:"",pe_fair:"",div:"",note:""});
  const [wlAdding,  setWlAdding] = useState(false);
  const [showAddFor,setShowAddFor]=useState(null);
  const fileRef=useRef();
  const backupFileRef=useRef();

  // ── SJ Company: funds / income / expense / invest / cards / tax ──
  const sjStored=sjLoad()||SJ_DEFAULT;
  const [funds,    setFunds]    = useState(sjStored.funds    ?? SJ_FUNDS_SEED);
  const [fundBuys, setFundBuys] = useState(sjStored.fundBuys ?? SJ_FUNDBUYS_SEED);
  const [income,   setIncome]   = useState(sjStored.income   ?? SJ_INCOME_SEED);
  const [expenses, setExpenses] = useState(sjStored.expenses ?? SJ_EXPENSE_SEED);
  const [invest,   setInvest]   = useState(sjStored.invest   ?? SJ_INVEST_SEED);
  const [cards,    setCards]    = useState(sjStored.cards    ?? SJ_CARDS_SEED);
  const [tax,      setTax]      = useState(sjStored.tax      ?? SJ_TAX_SEED);
  const [cfYear,   setCfYear]   = useState("2568");
  useEffect(()=>{ sjSave({funds,fundBuys,income,expenses,invest,cards,tax}); },[funds,fundBuys,income,expenses,invest,cards,tax]);

  // ── computed ────────────────────────────────────
  const activePorts=selPort==="all"?ports:ports.filter(p=>p.id===selPort);

  const consolidated=(()=>{
    const map={};
    activePorts.forEach(port=>port.holdings.forEach(h=>{
      if(!map[h.symbol])map[h.symbol]={...h,totalShares:0,totalCost:0,portIds:[]};
      map[h.symbol].totalShares+=h.shares; map[h.symbol].totalCost+=h.shares*h.avgCost; map[h.symbol].portIds.push(port.id);
    }));
    return Object.values(map).map(h=>{
      // fallback avgCost ถ้าไม่มีราคา → PnL = 0 (ไม่ให้แสดง phantom loss); guard /0 เมื่อขายหมด
      const avg=h.totalShares>0?(h.totalCost/h.totalShares):0,cp=prices[h.symbol]??avg,fv=calcFV(h),wfv=calcWorstFV(h),mv=h.totalShares*cp;
      const upside=calcUpside(cp,fv),downside=calcDownside(cp,wfv);
      const rr=calcRR(upside,downside);
      return { ...h,avgCost:avg,currentPrice:cp,marketValue:mv,pnl:mv-h.totalCost,pnlPct:avg>0?((cp-avg)/avg*100):0,
        fairValue:fv,worstFV:wfv,upside,downside,
        annual3Y:calcAnnual3Y(cp,fv,h.div), rr, judgement:getJudgement(rr) };
    });
  })();

  const totalCash=activePorts.reduce((a,p)=>a+p.cash,0),stocksMV=consolidated.reduce((a,h)=>a+h.marketValue,0),totalMV=stocksMV+totalCash,totalCost=consolidated.reduce((a,h)=>a+h.totalCost,0),totalPnL=consolidated.reduce((a,h)=>a+h.pnl,0),totalPnLPct=totalCost>0?(totalPnL/totalCost*100):0;
  const totalPortValue=totalMV; // ใช้ใน holdings tab สำหรับคำนวณ target value
  // ── SJ unified aggregates ──
  const fundsValue=funds.reduce((a,f)=>a+(+f.value||0),0), fundsCost=funds.reduce((a,f)=>a+(+f.cost||0),0), fundsPnL=fundsValue-fundsCost;
  const cardsBalance=cards.reduce((a,c)=>a+(+c.balance||0),0);
  // ใช้ปีล่าสุดที่มีข้อมูลครบ (2568) เป็นฐานสรุปต่อเดือนในภาพรวม
  const ovYear="2568";
  const incYearTotal=income.filter(i=>i.year===ovYear).reduce((a,i)=>a+(+i.amount||0),0);
  const expYearTotal=expenses.filter(e=>e.year===ovYear).reduce((a,e)=>a+(+e.amount||0),0);
  const incMonthly=incYearTotal/12, expMonthly=expYearTotal/12, netMonthly=incMonthly-expMonthly;
  // ภาษีทั้งปี (คำนวณสด)
  const taxAfterExempt=(+tax.grossIncome||0)-(+tax.exempt||0);
  const taxExpenseDed=Math.min(taxAfterExempt*0.5,100000);
  const taxDeductTotal=tax.deductions.reduce((a,d)=>a+(+d.amount||0),0);
  const taxNet=Math.max(0,taxAfterExempt-taxExpenseDed-taxDeductTotal);
  const taxDue=calcThaiTax(taxNet);
  const taxPayMore=taxDue-(+tax.wht||0);
  // Net worth = หุ้น(MV) + เงินสด + กองทุน − หนี้บัตรเครดิต
  const netWorth=stocksMV+totalCash+fundsValue-cardsBalance;
  // pnlPct: คิดจาก stock_cost+cash (total capital deployed)
  const portSums=ports.map(p=>{ const mv=p.holdings.reduce((a,h)=>a+h.shares*(prices[h.symbol]??h.avgCost),0)+p.cash,c=p.holdings.reduce((a,h)=>a+h.shares*h.avgCost,0),pnl=p.holdings.reduce((a,h)=>a+h.shares*((prices[h.symbol]??h.avgCost)-h.avgCost),0),totalCapital=c+p.cash; return{...p,mv,cost:c,pnl,pnlPct:totalCapital>0?(pnl/totalCapital*100):0}; });
  // กรองวันหยุดสุดสัปดาห์ออก (ตลาดหุ้นปิด เสาร์=6, อาทิตย์=0)
  const isWeekday=str=>{ const [y,m,d]=str.split("-").map(Number); return new Date(y,m-1,d).getDay()%6!==0; };
  const perfData=hist.filter(snap=>isWeekday(snap.date)).map(snap=>{ let mv=0; ports.forEach(p=>{ p.holdings.forEach(h=>{ mv+=h.shares*(snap.prices[h.symbol]??h.avgCost); }); mv+=p.cash; }); const h0=hist[0]; let mv0=0; ports.forEach(p=>{ p.holdings.forEach(h=>{ mv0+=h.shares*(h0.prices[h.symbol]??h.avgCost); }); mv0+=p.cash; }); return{date:fmtDate(snap.date),port:mv0>0?((mv-mv0)/mv0*100):0,set:((snap.set-h0.set)/h0.set*100),set50:((snap.set50-h0.set50)/h0.set50*100)}; });

  // ── stale-data indicator ────────────────────────
  const staleDays=(()=>{ const d=Math.round((new Date(TODAY())-new Date(lastUpd))/(864e5)); return d; })();

  // ── live fetch + auto-save EOD ──────────────────
  const fetchLivePrices = async (silent=false) => {
    if(!silent){ setFetchSt("fetching"); setStatusMsg("กำลังดึงราคา…"); }
    try {
      // ดึงราคาจาก Yahoo Finance โดยตรง (ไม่ต้องการ backend)
      const extraSymsList = watchList.map(w=>w.symbol).filter(Boolean);
      const coreNames = ['ADVICE','DOHOME','PR9','WASH','SGC','SGC-W2','CHAYO','JMART','JMT'];
      const allNames  = [...new Set([...coreNames, ...extraSymsList])];
      const yfSyms    = [...allNames.map(s=>s+'.BK'), '%5ESET.BK', '%5ESET50.BK'].join(',');
      const res = await fetch(
        `https://query2.finance.yahoo.com/v7/finance/quote?symbols=${yfSyms}&fields=regularMarketPrice`,
        {headers:{Accept:'application/json'}}
      );
      if(!res.ok) throw new Error(`yahoo error ${res.status}`);
      const json = await res.json();
      const results = json?.quoteResponse?.result ?? [];
      // แปลงเป็น format เดิม
      const data = {'_date': new Date().toISOString().slice(0,10)};
      results.forEach(q => {
        const p = q.regularMarketPrice;
        if(!p) return;
        if(q.symbol==='^SET.BK')   data['_SET']   = p;
        else if(q.symbol==='^SET50.BK') data['_SET50'] = p;
        else data[q.symbol.replace('.BK','')] = Math.round(p*100)/100;
      });
      const np={...prices}; let cnt=0, ns=setP, ns50=set50P, nsPE=setPE, ns50PE=set50PE;
      Object.entries(data).forEach(([sym,price])=>{
        if(price==null||sym==="_date") return;
        if(sym==="_SET") ns=price;
        else if(sym==="_SET50") ns50=price;
        else if(sym==="_SET_PE") nsPE=price;
        else if(sym==="_SET50_PE") ns50PE=price;
        else { np[sym]=price; cnt++; }
      });
      if(cnt===0) throw new Error("ไม่มีราคา — ตลาดอาจปิด");
      const d=TODAY();
      setPrices(np); setSetP(ns); setSet50P(ns50); setSetPE(nsPE); setSet50PE(ns50PE);
      setHist(prev=>[...prev.filter(x=>x.date!==d),{date:d,prices:{...np},set:ns,set50:ns50}].sort((a,b)=>a.date.localeCompare(b.date)));
      setLastUpd(d);
      setFetchSt("success"); setStatusMsg(`✅ อัปเดต ${cnt} หุ้น · บันทึก EOD แล้ว`);
      setTimeout(()=>{ setFetchSt("idle"); setStatusMsg(""); },5000);
    } catch(e) {
      setFetchSt("error");
      if(!silent){ setStatusMsg(`❌ ${e.message}`); setTimeout(()=>{ setFetchSt("idle"); setStatusMsg(""); },6000); }
      else setFetchSt("idle");
    }
  };

  // ── sync cash จาก txList ทุกครั้งที่ txList เปลี่ยน ────
  useEffect(()=>{
    setPorts(prev => prev.map(p => ({...p, cash: deriveCash(p.id, txList)})));
  }, [txList]);

  // ── auto-fetch on mount if stale ────────────────
  useEffect(()=>{
    const el=document.getElementById("app-loader"); if(el)el.style.display="none";
    const now=new Date();
    const bkk=new Date(now.toLocaleString("en-US",{timeZone:"Asia/Bangkok"}));
    const hour=bkk.getHours();
    if(lastUpd<TODAY()&&hour>=17){ fetchLivePrices(true); }
  },[]);

  useEffect(()=>{ save({ports,prices,setP,set50P,hist,lastUpd,txList,watchList,setPE,set50PE}); },[ports,prices,setP,set50P,hist,lastUpd,txList,watchList,setPE,set50PE]);

  const saveEOD=()=>{ const np={}; Object.entries(editP).forEach(([k,v])=>{np[k]=parseFloat(v)||0;}); const ns=parseFloat(eSet)||setP,ns50=parseFloat(eSet50)||set50P; setPrices(np);setSetP(ns);setSet50P(ns50); const d=TODAY(); setHist(prev=>[...prev.filter(x=>x.date!==d),{date:d,prices:{...np},set:ns,set50:ns50}].sort((a,b)=>a.date.localeCompare(b.date))); setLastUpd(d);setModal(null); };
  const addTx=()=>{
    // cash ถูก derive อัตโนมัติจาก txList ผ่าน useEffect — ไม่ต้อง setPorts cash เอง
    if(txForm.mode==="cash"){
      if(!txForm.amount)return;
      const amt=parseFloat(txForm.amount), txDate=txForm.date||TODAY();
      if(txForm._editId){
        setTxList(prev=>prev.map(t=>t.id===txForm._editId?{...t,type:txForm.type,amount:amt,note:txForm.note,date:txDate}:t));
      } else {
        setTxList(prev=>[{...txForm,amount:amt,date:txDate,id:Date.now()},...prev]);
      }
      setTxForm(f=>({...f,amount:"",note:"",_editId:null})); return;
    }
    if(!txForm.symbol||!txForm.shares||!txForm.price)return;
    const sh=parseFloat(txForm.shares),pr=parseFloat(txForm.price);
    const gross=sh*pr;
    const {comm,vat}=calcComm(txForm.portId,gross,txForm.commRate,txForm.commMin);
    const netTotal=txForm.type==="SELL"?gross-comm-vat:gross+comm+vat;
    const txDate=txForm.date||TODAY();
    if(txForm._editId){
      setTxList(prev=>prev.map(t=>t.id===txForm._editId?{...t,symbol:txForm.symbol,shares:sh,price:pr,amount:gross,comm,vat,netTotal,date:txDate,commRate:txForm.commRate,commMin:txForm.commMin,type:txForm.type}:t));
    } else {
      setTxList(prev=>[{...txForm,shares:sh,price:pr,amount:gross,comm,vat,netTotal,date:txDate,id:Date.now()},...prev]);

        return{...port,holdings:newH};

  const addHolding=(portId)=>{ if(!addForm.symbol||!addForm.shares||!addForm.avgCost)return; const sh=parseFloat(addForm.shares),av=parseFloat(addForm.avgCost),sym=addForm.symbol.toUpperCase(); setPorts(prev=>prev.map(p=>{ if(p.id!==portId)return p; const ex=p.holdings.find(h=>h.symbol===sym); if(ex)return{...p,holdings:p.holdings.map(h=>h.symbol!==sym?h:{...h,shares:sh,avgCost:av})}; return{...p,holdings:[...p.holdings,{symbol:sym,shares:sh,avgCost:av,sector:"Other",pe_core:8,pe_fair:10,eps_worst:0,eps_3y:0,div:0,targetPct:0.05}]}; })); setAddForm({symbol:"",shares:"",avgCost:""}); setShowAddFor(null); };
  const handleCSV=e=>{ const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{try{const lines=ev.target.result.split("\n").filter(l=>l.trim()),hds=lines[0].split(",").map(h=>h.trim().toLowerCase());let upd=0;lines.slice(1).forEach(line=>{const cols=line.split(",").map(c=>c.trim()),row={};hds.forEach((h,i)=>{row[h]=cols[i];});const sym=(row["symbol"]||row["หุ้น"]||"").toUpperCase(),pr=parseFloat(row["price"]||row["ราคา"]||0);if(sym&&pr>0){setPrices(prev=>({...prev,[sym]:pr}));upd++;}});setStatusMsg(`✅ CSV: อัปเดต ${upd} หุ้น`);setTimeout(()=>setStatusMsg(""),4000);setModal(null);}catch{setStatusMsg("❌ CSV format ผิด");}};r.readAsText(file);e.target.value=""; };

                  const HRow=({rowKey,sym,cp,fv,wfv,mv,upside,dn,ann3y,rr,jdg,h,portBadges,ap})=>(
                    <tr key={rowKey} className="rh" style={{borderBottom:`1px solid ${C.border}`}}>
                      <td style={{padding:"8px 10px",fontWeight:700,fontSize:12,color:C.text}}>{sym}</td>
                      <td style={{padding:"8px 8px",display:"flex",gap:2,flexWrap:"wrap"}}>
                        {portBadges.map(p=><span key={p.id} style={{background:`${p.color}18`,color:p.color,borderRadius:4,padding:"2px 5px",fontSize:10,fontWeight:700}}>{p.broker}</span>)}
                      </td>
                      <td style={{textAlign:"right",padding:"8px 8px",fontFamily:"'DM Mono',monospace",fontWeight:600}}>{fmt(cp)}</td>
                      <td style={{textAlign:"right",padding:"8px 8px",color:C.sub,fontFamily:"'DM Mono',monospace"}}>{fmt(h.eps_worst,3)}</td>
                      <td style={{textAlign:"right",padding:"8px 8px",color:C.sub,fontFamily:"'DM Mono',monospace"}}>{fmt(h.eps_3y,3)}</td>
                      <td style={{textAlign:"right",padding:"8px 8px",color:C.sub,fontFamily:"'DM Mono',monospace"}}>{fmt(h.pe_core,0)}</td>
                      <td style={{textAlign:"right",padding:"8px 8px",color:C.sub,fontFamily:"'DM Mono',monospace"}}>{fmt(h.pe_fair,0)}</td>
                      <td style={{textAlign:"right",padding:"8px 8px",fontFamily:"'DM Mono',monospace",color:wfv>0?(wfv>cp?C.up:C.dn):C.muted,fontWeight:wfv>0?600:400}}>{wfv>0?fmt(wfv):"—"}</td>
                      <td style={{textAlign:"right",padding:"8px 8px",fontFamily:"'DM Mono',monospace",color:fv>0?(fv>cp?C.up:C.dn):C.muted,fontWeight:fv>0?600:400}}>{fv>0?fmt(fv):"—"}</td>
                      <td style={{textAlign:"right",padding:"8px 8px",color:C.sub,fontFamily:"'DM Mono',monospace"}}>{fmt(h.div,2)}</td>
                      <td style={{textAlign:"right",padding:"8px 8px",fontFamily:"'DM Mono',monospace",fontWeight:600,color:dn!=null?(up(dn)?C.up:C.dn):C.muted}}>{dn!=null?pct(dn):"—"}</td>
                      <td style={{textAlign:"right",padding:"8px 8px",fontFamily:"'DM Mono',monospace",fontWeight:600,color:ann3y!=null?(up(ann3y)?C.up:C.dn):C.muted}}>{ann3y!=null?pct(ann3y):"—"}</td>
                      <td style={{textAlign:"right",padding:"8px 8px",fontFamily:"'DM Mono',monospace",fontWeight:600,color:upside!=null?(up(upside)?C.up:C.dn):C.muted}}>{upside!=null?pct(upside):"—"}</td>
                      <td style={{textAlign:"right",padding:"8px 8px",fontFamily:"'DM Mono',monospace",fontWeight:700,color:rr!=null?(rr>7?C.up:rr>=5?"#d97706":C.muted):C.muted}}>{rr!=null?`${fmt(rr,1)}x`:"—"}</td>
                      <td style={{textAlign:"right",padding:"8px 8px"}}>
                        {jdg?<span style={{background:jdg.bg,color:jdg.color,border:`1px solid ${jdg.border}`,borderRadius:6,padding:"2px 8px",fontSize:10,fontWeight:700,whiteSpace:"nowrap"}}>{jdg.text}</span>:<span style={{color:C.muted}}>—</span>}
                      </td>
                      <td style={{textAlign:"right",padding:"8px 8px",fontFamily:"'DM Mono',monospace",fontWeight:600}}>{fmtK(mv)}</td>
                      <td style={{textAlign:"right",padding:"8px 8px",fontFamily:"'DM Mono',monospace",color:C.muted}}>{fmt(ap,1)}%</td>
                    </tr>
                  );

                  if(selPort==="all"){
                    // ── CONSOLIDATED: 1 row per symbol, sorted by market value DESC ── (เฉพาะที่ยังถือ)
                    return [...consolidated].filter(h=>h.totalShares>0).sort((a,b)=>(b.marketValue||0)-(a.marketValue||0)).map(h=>{
                      const cp=h.currentPrice,fv=h.fairValue,wfv=h.worstFV,mv=h.marketValue;
                      const ap=totalMV>0?(mv/totalMV*100):0;
                      const portBadges=ports.filter(p=>h.portIds.includes(p.id));
                      return <HRow key={"cons_"+h.symbol} rowKey={"cons_"+h.symbol} sym={h.symbol} cp={cp} fv={fv} wfv={wfv} mv={mv}
                        upside={h.upside} dn={h.downside} ann3y={h.annual3Y} rr={h.rr} jdg={h.judgement} h={h}
                        portBadges={portBadges} ap={ap}/>;
                    });
                  } else {
                    // ── PER-PORT: individual rows sorted by market value DESC ── (เฉพาะที่ยังถือ)
                    const _all=activePorts.flatMap(port=>[...port.holdings].filter(h=>h.shares>0).map(h=>({h,port})));
                    _all.sort((a,b)=>(b.h.shares*(prices[b.h.symbol]??0))-(a.h.shares*(prices[a.h.symbol]??0)));
                    return _all.map(({h,port})=>{
                      const cp=prices[h.symbol]??0,fv=calcFV(h),wfv=calcWorstFV(h),mv=h.shares*cp;
                      const upside=calcUpside(cp,fv),dn=calcDownside(cp,wfv),ann3y=calcAnnual3Y(cp,fv,h.div);
                      const rr=calcRR(upside,dn),jdg=getJudgement(rr);
                      const ap=totalMV>0?(mv/totalMV*100):0;
                      return <HRow key={port.id+h.symbol} rowKey={port.id+h.symbol} sym={h.symbol} cp={cp} fv={fv} wfv={wfv} mv={mv}
                        upside={upside} dn={dn} ann3y={ann3y} rr={rr} jdg={jdg} h={h}
                        portBadges={[port]} ap={ap}/>;
                    });
                  }
                })()}
              </tbody>
              <tfoot>
                <tr style={{borderTop:`2px solid ${C.border}`,background:"#f8fafc"}}>
                  <td colSpan={15} style={{padding:"10px 8px",color:C.muted,fontSize:11,textAlign:"right",fontWeight:600}}>รวมพอร์ต</td>
                  <td style={{textAlign:"right",padding:"10px 8px",fontFamily:"'DM Mono',monospace",fontWeight:800,fontSize:13}}>{fmtK(totalMV)}</td>
                  <td style={{textAlign:"right",padding:"10px 8px",fontFamily:"'DM Mono',monospace",color:C.muted,fontWeight:600}}>100%</td>
                </tr>
              </tfoot>
            </table>
          </div>

          {/* ── Watch List ── ย้ายไป Tab วิเคราะห์ แล้ว */}
          {false&&(()=>{
            const soldOut=consolidated.filter(h=>h.totalShares===0);
            const wlSymSet=new Set(watchList.map(w=>w.symbol));
            const autoWlItems=soldOut
              .filter(h=>!wlSymSet.has(h.symbol))
              .map(h=>({id:"auto_"+h.symbol,symbol:h.symbol,eps_worst:h.eps_worst??0,eps_3y:h.eps_3y??0,pe_core:h.pe_core??0,pe_fair:h.pe_fair??0,div:h.div??0,note:"",_auto:true}));
            const displayWl=[...autoWlItems,...watchList];
            const wlEditCell=(id,field,val,w=65)=>{
              const WEC=({id,field,val,w})=>{
                const [editing,setEditing]=useState(false);
                const [v,setV]=useState(String(val));
                const save=()=>{ setWatchList(prev=>prev.map(w=>w.id!==id?w:{...w,[field]:parseFloat(v)||v})); setEditing(false); };
                if(!editing)return <span onClick={()=>setEditing(true)} style={{cursor:"pointer",borderBottom:"1px dashed #cbd5e1",fontFamily:"'DM Mono',monospace"}}>{val||"—"}</span>;
                return <input autoFocus type="number" value={v} style={{background:"#f8fafc",border:`1px solid ${C.border}`,borderRadius:6,color:C.text,padding:"2px 5px",fontSize:11,fontFamily:"'DM Mono',monospace",outline:"none",width:w}} onChange={e=>setV(e.target.value)} onBlur={save} onKeyDown={e=>e.key==="Enter"&&save()}/>;
              };
              return <WEC id={id} field={field} val={val} w={w}/>;
            };
            const thS={textAlign:"right",padding:"10px 8px",fontWeight:600,color:C.muted,fontSize:10,textTransform:"uppercase",letterSpacing:.5,whiteSpace:"nowrap"};
            const tdS={textAlign:"right",padding:"9px 8px",fontFamily:"'DM Mono',monospace",fontSize:11};
            return (
            <>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
                <div style={{fontWeight:800,fontSize:16,color:C.text}}>Watch List</div>
                <button onClick={()=>setWlAdding(v=>!v)} style={{background:wlAdding?"#f1f5f9":"#6366f1",color:wlAdding?C.muted:"#fff",border:`1px solid ${wlAdding?C.border:"#6366f1"}`,borderRadius:8,padding:"6px 16px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                  {wlAdding?"ยกเลิก":"+ เพิ่มหุ้น"}
                </button>
              </div>

              {/* Add form */}
              {wlAdding&&<div style={{...card,marginBottom:12,border:`1px dashed #6366f1`,background:"#f8f8ff"}}>
                <div style={{fontSize:12,fontWeight:700,color:"#6366f1",marginBottom:12}}>เพิ่มหุ้นใน Watch List</div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end"}}>
                  {[
                    {lbl:"ชื่อหุ้น*",k:"symbol",t:"text",w:90,ph:"ADVICE"},
                    {lbl:"EPS Worst",k:"eps_worst",t:"number",w:80,ph:"0.521"},
                    {lbl:"EPS 3Y",k:"eps_3y",t:"number",w:80,ph:"1.441"},
                    {lbl:"PE Core",k:"pe_core",t:"number",w:65,ph:"10"},
                    {lbl:"PE Fair",k:"pe_fair",t:"number",w:65,ph:"12"},
                    {lbl:"Div",k:"div",t:"number",w:65,ph:"0.35"},
                    {lbl:"หมายเหตุ",k:"note",t:"text",w:120,ph:"เหตุผล"},
                  ].map(({lbl,k,t,w,ph})=>(
                    <div key={k}>
                      <div style={{fontSize:10,color:C.muted,fontWeight:600,textTransform:"uppercase",letterSpacing:.7,marginBottom:4}}>{lbl}</div>
                      <input type={t} placeholder={ph} value={wlAddForm[k]}
                        onChange={e=>setWlAddForm(f=>({...f,[k]:t==="text"?e.target.value.toUpperCase():e.target.value}))}
                        style={{background:"#fff",border:`1px solid ${C.border}`,borderRadius:7,color:C.text,padding:"7px 9px",fontSize:12,fontFamily:t==="number"?"'DM Mono',monospace":"inherit",outline:"none",width:w}}/>
                    </div>
                  ))}
                  <button onClick={()=>{
                    if(!wlAddForm.symbol)return;
                    setWatchList(prev=>[...prev,{...wlAddForm,id:Date.now(),eps_worst:parseFloat(wlAddForm.eps_worst)||0,eps_3y:parseFloat(wlAddForm.eps_3y)||0,pe_core:parseFloat(wlAddForm.pe_core)||0,pe_fair:parseFloat(wlAddForm.pe_fair)||0,div:parseFloat(wlAddForm.div)||0}]);
                    setWlAddForm({symbol:"",eps_worst:"",eps_3y:"",pe_core:"",pe_fair:"",div:"",note:""});
                    setWlAdding(false);
                  }} style={{background:"#6366f1",color:"#fff",border:"none",borderRadius:8,padding:"8px 20px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",alignSelf:"flex-end"}}>+ เพิ่ม</button>
                </div>
              </div>}

              <div style={{...card,padding:0,overflowX:"auto"}}>
                {displayWl.length===0
                  ?<div style={{padding:"32px",textAlign:"center",color:C.muted,fontSize:13}}>ยังไม่มีหุ้นใน Watch List — กด "+ เพิ่มหุ้น"</div>
                  :<table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                    <thead>
                      <tr style={{borderBottom:`2px solid ${C.border}`,background:"#f8fafc"}}>
                        <th style={{...thS,textAlign:"left",minWidth:80}}>หุ้น</th>
                        <th style={{...thS,minWidth:60}}>ราคา</th>
                        <th style={{...thS,minWidth:65}}>EPS W</th>
                        <th style={{...thS,minWidth:65}}>EPS 3Y</th>
                        <th style={{...thS,minWidth:55}}>PE Core</th>
                        <th style={{...thS,minWidth:55}}>PE Fair</th>
                        <th style={{...thS,minWidth:60}}>Worst FV</th>
                        <th style={{...thS,minWidth:60}}>Fair FV</th>
                        <th style={{...thS,minWidth:55}}>Div</th>
                        <th style={{...thS,minWidth:75}}>Downside</th>
                        <th style={{...thS,minWidth:75}}>Upside 3Y</th>
                        <th style={{...thS,minWidth:70}}>CAGR 3Y*</th>
                        <th style={{...thS,minWidth:55}}>R/R</th>
                        <th style={{...thS,minWidth:90}}>Judgement</th>
                        <th style={{...thS,minWidth:120,textAlign:"left"}}>หมายเหตุ</th>
                        <th style={{...thS,minWidth:50}}></th>
                      </tr>
                    </thead>
                    <tbody>
                      {displayWl.map(w=>{
                        const cp=prices[w.symbol]??0;
                        const fv=calcFV(w),wfv=calcWorstFV(w);
                        const upside=calcUpside(cp,fv),downside=calcDownside(cp,wfv);
                        const ann3y=calcAnnual3Y(cp,fv,w.div);
                        const rr=calcRR(upside,downside),jdg=getJudgement(rr);
                        return (
                          <tr key={w.id} className="rh" style={{borderBottom:`1px solid ${C.border}`,background:w._auto?"#fffbf0":""}}>
                            <td style={{padding:"9px 10px",fontWeight:700,fontSize:12,color:C.text}}>
                              {w.symbol}
                              {w._auto&&<span style={{marginLeft:5,fontSize:9,background:"#fef3c7",color:"#b45309",border:"1px solid #fde68a",borderRadius:4,padding:"1px 5px",fontWeight:700,verticalAlign:"middle"}}>ขายหมด</span>}
                            </td>
                            <td style={{...tdS,color:cp>0?C.text:C.muted}}>{cp>0?fmt(cp):"—"}</td>
                            <td style={{...tdS,color:C.sub}}>{w._auto?<span style={{fontFamily:"'DM Mono',monospace"}}>{fmt(w.eps_worst,3)}</span>:wlEditCell(w.id,"eps_worst",fmt(w.eps_worst,3))}</td>
                            <td style={{...tdS,color:C.sub}}>{w._auto?<span style={{fontFamily:"'DM Mono',monospace"}}>{fmt(w.eps_3y,3)}</span>:wlEditCell(w.id,"eps_3y",fmt(w.eps_3y,3))}</td>
                            <td style={{...tdS,color:C.sub}}>{w._auto?<span style={{fontFamily:"'DM Mono',monospace"}}>{fmt(w.pe_core,0)}</span>:wlEditCell(w.id,"pe_core",fmt(w.pe_core,0))}</td>
                            <td style={{...tdS,color:C.sub}}>{w._auto?<span style={{fontFamily:"'DM Mono',monospace"}}>{fmt(w.pe_fair,0)}</span>:wlEditCell(w.id,"pe_fair",fmt(w.pe_fair,0))}</td>
                            <td style={{...tdS,fontWeight:600,color:wfv>0?(wfv>cp?C.up:C.dn):C.muted}}>{wfv>0?fmt(wfv):"—"}</td>
                            <td style={{...tdS,fontWeight:600,color:fv>0?(fv>cp?C.up:C.dn):C.muted}}>{fv>0?fmt(fv):"—"}</td>
                            <td style={{...tdS,color:C.sub}}>{w._auto?<span style={{fontFamily:"'DM Mono',monospace"}}>{fmt(w.div,2)}</span>:wlEditCell(w.id,"div",fmt(w.div,2))}</td>
                            <td style={{...tdS,fontWeight:600,color:downside!=null?(up(downside)?C.up:C.dn):C.muted}}>{downside!=null?pct(downside):"—"}</td>
                            <td style={{...tdS,fontWeight:600,color:upside!=null?(up(upside)?C.up:C.dn):C.muted}}>{upside!=null?pct(upside):"—"}</td>
                            <td style={{...tdS,fontWeight:600,color:ann3y!=null?(up(ann3y)?C.up:C.dn):C.muted}}>{ann3y!=null?pct(ann3y):"—"}</td>
                            <td style={{...tdS,fontWeight:700,color:rr!=null?(rr>7?C.up:rr>=5?"#d97706":C.muted):C.muted}}>{rr!=null?`${fmt(rr,1)}x`:"—"}</td>
                            <td style={{...tdS}}>
                              {jdg?<span style={{background:jdg.bg,color:jdg.color,border:`1px solid ${jdg.border}`,borderRadius:6,padding:"2px 8px",fontSize:10,fontWeight:700,whiteSpace:"nowrap"}}>{jdg.text}</span>:<span style={{color:C.muted}}>—</span>}
                            </td>
                            <td style={{padding:"9px 8px",fontSize:11,color:C.sub,maxWidth:140}}>
                              {w._auto
                                ?<span style={{color:C.muted,fontStyle:"italic"}}>—</span>
                                :<span contentEditable suppressContentEditableWarning
                                  onBlur={e=>setWatchList(prev=>prev.map(x=>x.id!==w.id?x:{...x,note:e.target.innerText}))}
                                  style={{display:"block",outline:"none",borderBottom:"1px dashed #e2e8f0",minWidth:80,cursor:"text"}}>
                                  {w.note||""}
                                </span>
                              }
                            </td>
                            <td style={{padding:"9px 8px",textAlign:"center"}}>
                              {!w._auto&&<button onClick={()=>setWatchList(prev=>prev.filter(x=>x.id!==w.id))} style={{background:"none",border:"1px solid #fecaca",color:"#dc2626",borderRadius:6,padding:"2px 8px",fontSize:10,cursor:"pointer",fontFamily:"inherit"}}>ลบ</button>}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                }
              </div>
              <div style={{fontSize:10,color:C.muted,marginTop:6,textAlign:"center"}}>* คลิกค่า EPS/PE/Div เพื่อแก้ไข · คลิกช่องหมายเหตุเพื่อพิมพ์</div>
            </>
            );
          })()}
        </>}

        {/* ══ ANALYSIS ══ */}
        {tab==="analysis"&&(()=>{
          // รวม: portfolio stocks (ทุกตัว รวม sold-out) + watch-only stocks
          const portSymbols=new Set(consolidated.map(h=>h.symbol));
          const wlOnlyItems=watchList
            .filter(w=>!portSymbols.has(w.symbol))
            .map(w=>{
              const cp=prices[w.symbol]??0;
              const fv=calcFV(w),wfv=calcWorstFV(w);
              const upside=calcUpside(cp,fv),downside=calcDownside(cp,wfv);
              const rr=calcRR(upside,downside);
              return {...w,currentPrice:cp,fairValue:fv,worstFV:wfv,upside,downside,
                annual3Y:calcAnnual3Y(cp,fv,w.div),rr,judgement:getJudgement(rr),
                totalShares:0,marketValue:0,_watchOnly:true};
            });
          const analysisItems=[...consolidated,...wlOnlyItems];

          // routing edit: portfolio → applyEditAll, watch-only → setWatchList
          const editAnalysis=(h,field,v)=>{
            if(h._watchOnly)
              setWatchList(prev=>prev.map(w=>w.symbol!==h.symbol?w:{...w,[field]:parseFloat(v)||0}));
            else
              applyEditAll(h.symbol,field,v);
          };

          return (<>
          {/* Judgement Summary */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:16}}>
            {[
              {key:"ซื้อ",   label:"🟢 ซื้อ",    color:"#16a34a", bg:"rgba(22,163,74,0.08)",   border:"rgba(22,163,74,0.2)",   cond:h=>h.rr!=null&&h.rr>7},
              {key:"Monitor",label:"🟡 Monitor", color:"#d97706", bg:"rgba(245,158,11,0.08)",  border:"rgba(245,158,11,0.2)",  cond:h=>h.rr!=null&&h.rr>=5&&h.rr<=7},
              {key:"ช่างมัน",label:"⚫ ช่างมัน", color:"#94a3b8", bg:"rgba(148,163,184,0.08)",border:"rgba(148,163,184,0.2)",cond:h=>h.rr!=null&&h.rr<5},
            ].map(grp=>{
              const items=analysisItems.filter(grp.cond);
              return (
                <div key={grp.key} style={{...card,border:`1px solid ${grp.border}`,background:grp.bg}}>
                  <div style={{fontWeight:700,fontSize:13,color:grp.color,marginBottom:10}}>{grp.label}</div>
                  {items.length===0&&<div style={{color:C.muted,fontSize:12}}>ไม่มี</div>}
                  {items.map(h=>(
                    <div key={h.symbol} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7,padding:"6px 8px",background:"rgba(255,255,255,0.6)",borderRadius:8}}>
                      <div>
                        <div style={{fontWeight:700,fontSize:12,color:C.text}}>
                          {h.symbol}
                        </div>
                        <div style={{fontSize:10,color:C.muted}}>฿{fmt(h.currentPrice)} → FV ฿{fmt(h.fairValue)}</div>
                      </div>
                      <div style={{textAlign:"right"}}>
                        <div style={{fontFamily:"'DM Mono',monospace",fontWeight:700,color:grp.color,fontSize:12}}>R/R {h.rr!=null?fmt(h.rr,1):"-"}x</div>
                        <div style={{fontFamily:"'DM Mono',monospace",fontSize:10,color:C.muted}}>{h.upside!=null?pct(h.upside):"—"} upside</div>
                      </div>
                    </div>
                  ))}
                </div>
              );
            })}
          </div>

          {/* Risk/Reward table — editable */}
          <div style={{...card,padding:0,overflowX:"auto"}}>
            <div style={{padding:"14px 16px",borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div style={{fontWeight:700,fontSize:13}}>Risk to Reward — ตาราง</div>
              <div style={{fontSize:10,color:C.muted}}>💡 คลิกตัวเลขขีดเส้นใต้เพื่อแก้ไข EPS / PE / Div</div>
            </div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"flex-end",padding:"6px 16px",borderBottom:`1px solid ${C.border}`,gap:8}}>
              <button onClick={()=>setWlAdding(v=>!v)} style={{background:wlAdding?"#f1f5f9":"#6366f1",color:wlAdding?C.muted:"#fff",border:`1px solid ${wlAdding?C.border:"#6366f1"}`,borderRadius:8,padding:"5px 14px",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                {wlAdding?"ยกเลิก":"+ เพิ่มหุ้น Watch"}
              </button>
            </div>
            {wlAdding&&<div style={{padding:"12px 16px",borderBottom:`1px solid ${C.border}`,background:"#f8f8ff"}}>
              <div style={{fontSize:11,fontWeight:700,color:"#6366f1",marginBottom:10}}>เพิ่มหุ้นใน Watch List</div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end"}}>
                {[{lbl:"ชื่อหุ้น*",k:"symbol",t:"text",w:90,ph:"MOSHI"},{lbl:"EPS W",k:"eps_worst",t:"number",w:70,ph:"0.000"},{lbl:"EPS 3Y",k:"eps_3y",t:"number",w:70,ph:"0.000"},{lbl:"PE Core",k:"pe_core",t:"number",w:60,ph:"10"},{lbl:"PE Fair",k:"pe_fair",t:"number",w:60,ph:"12"},{lbl:"Div",k:"div",t:"number",w:60,ph:"0.00"}].map(({lbl,k,t,w,ph})=>(
                  <div key={k}>
                    <div style={{fontSize:10,color:C.muted,fontWeight:600,textTransform:"uppercase",letterSpacing:.7,marginBottom:4}}>{lbl}</div>
                    <input type={t} placeholder={ph} value={wlAddForm[k]}

        return (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.4)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:16,backdropFilter:"blur(4px)"}}>
          <div style={{background:"#fff",border:`1px solid ${C.border}`,borderRadius:18,padding:24,width:"100%",maxWidth:460,maxHeight:"92vh",overflowY:"auto",boxShadow:"0 20px 60px rgba(0,0,0,.15)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
              <div style={{fontWeight:800,fontSize:15,color:C.text}}>{isEdit?"✏️ แก้ไขรายการ":"+ บันทึกรายการ"}</div>
              <button onClick={()=>{setModal(null);setTxForm(f=>({...f,_editId:null}));}} style={{background:"none",border:"none",color:C.muted,fontSize:22,cursor:"pointer",lineHeight:1}}>✕</button>
            </div>

            {/* Mode toggle — disable when editing */}
            {!isEdit&&<div style={{display:"flex",gap:6,marginBottom:16,background:"#f1f5f9",borderRadius:10,padding:4}}>
              {[["stock","📈 ซื้อ/ขายหุ้น"],["cash","💵 โอนเงิน"]].map(([m,l])=>(
                <button key={m} onClick={()=>setTxForm(f=>({...f,mode:m,type:m==="stock"?"BUY":"DEPOSIT"}))}
                  style={{flex:1,background:txForm.mode===m?"#fff":"transparent",color:txForm.mode===m?C.text:C.muted,border:"none",borderRadius:7,padding:"9px 0",cursor:"pointer",fontWeight:700,fontSize:13,fontFamily:"inherit",boxShadow:txForm.mode===m?shadow:"none",transition:"all .15s"}}>{l}</button>
              ))}
            </div>}

            {/* Port + Date (same row) */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
              <div>
                <label style={lbl}>Port</label>
                <select value={txForm.portId} onChange={e=>{ const br=BROKER_RATES[e.target.value]||{rate:0.15,min:50}; setTxForm(f=>({...f,portId:e.target.value,commRate:String(br.rate),commMin:String(br.min)})); }} style={inp} disabled={isEdit}>
                  {ports.map(p=><option key={p.id} value={p.id}>{p.label}</option>)}
                </select>
              </div>
              <div>
                <label style={lbl}>วันที่ทำรายการ</label>
                <input type="date" value={txForm.date} onChange={e=>setTxForm(f=>({...f,date:e.target.value}))} style={inp}/>
              </div>
            </div>

            {txForm.mode==="stock"?<>
              {/* BUY / SELL */}
              <div style={{display:"flex",gap:6,marginBottom:12}}>
                {[["BUY","ซื้อ","#16a34a"],["SELL","ขาย","#dc2626"]].map(([t,l,clr])=>(
                  <button key={t} onClick={()=>setTxForm(f=>({...f,type:t}))}
                    style={{flex:1,background:txForm.type===t?`${clr}15`:"#f8fafc",border:`1.5px solid ${txForm.type===t?clr:C.border}`,color:txForm.type===t?clr:C.muted,borderRadius:8,padding:"9px 0",cursor:"pointer",fontWeight:800,fontSize:14,fontFamily:"inherit"}}>{l}</button>
                ))}
              </div>

              {/* Symbol */}
              <div style={{marginBottom:12}}>
                <label style={lbl}>ชื่อหุ้น</label>
                <input placeholder="เช่น ADVICE" value={txForm.symbol} onChange={e=>setTxForm(f=>({...f,symbol:e.target.value.toUpperCase()}))} style={{...inp,fontSize:15}}/>
              </div>

              {/* Shares + Price */}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
                <div>
                  <label style={lbl}>จำนวนหุ้น</label>
                  <input type="number" placeholder="10000" value={txForm.shares} onChange={e=>setTxForm(f=>({...f,shares:e.target.value}))} style={inp}/>
                </div>
                <div>
                  <label style={lbl}>ราคา/หุ้น (฿)</label>
                  <input type="number" placeholder="5.95" value={txForm.price} onChange={e=>setTxForm(f=>({...f,price:e.target.value}))} style={inp}/>
                </div>
              </div>

              {/* Commission settings */}
              <div style={{background:"#f8fafc",border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 14px",marginBottom:12}}>
                <div style={{fontSize:10,color:C.muted,fontWeight:700,textTransform:"uppercase",letterSpacing:.8,marginBottom:8}}>
                  ค่าคอมฯ — {BROKER_RATES[txForm.portId]?.label||txForm.portId} Online
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                  <div>
                    <label style={lbl}>อัตรา Commission (%)</label>
                    <input type="number" step="0.01" value={txForm.commRate} onChange={e=>setTxForm(f=>({...f,commRate:e.target.value}))} style={inp}/>
                  </div>
                  <div>
                    <label style={lbl}>ขั้นต่ำ (฿)</label>
                    <input type="number" value={txForm.commMin} onChange={e=>setTxForm(f=>({...f,commMin:e.target.value}))} style={inp}/>
                  </div>
                </div>
              </div>

              {/* Summary */}
              {gross>0&&<div style={{background:txForm.type==="BUY"?"#f0fdf4":"#fff5f5",border:`1px solid ${txForm.type==="BUY"?"#bbf7d0":"#fecaca"}`,borderRadius:10,padding:"12px 14px",marginBottom:14}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:C.sub,marginBottom:5}}>
                  <span>มูลค่าหุ้น ({(txForm.shares||0).toLocaleString()} × ฿{txForm.price})</span>
                  <span style={{fontFamily:"'DM Mono',monospace"}}>฿{fmt(gross)}</span>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:C.sub,marginBottom:5}}>
                  <span>Commission ({txForm.commRate}% min ฿{txForm.commMin})</span>
                  <span style={{fontFamily:"'DM Mono',monospace"}}>฿{fmt(comm)}</span>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:C.sub,marginBottom:8}}>
                  <span>VAT 7% (จาก commission)</span>
                  <span style={{fontFamily:"'DM Mono',monospace"}}>฿{fmt(vat)}</span>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:13,fontWeight:800,borderTop:`1px solid ${txForm.type==="BUY"?"#bbf7d0":"#fecaca"}`,paddingTop:8}}>
                  <span style={{color:txForm.type==="BUY"?"#16a34a":"#dc2626"}}>{txForm.type==="BUY"?"รวมจ่ายทั้งหมด":"รับสุทธิ"}</span>
                  <span style={{fontFamily:"'DM Mono',monospace",color:txForm.type==="BUY"?"#16a34a":"#dc2626"}}>{txForm.type==="BUY"?"+":"-"}฿{fmt(netTotal)}</span>
                </div>
              </div>}

              <button onClick={()=>{addTx();setModal(null);}} style={{width:"100%",...btn(txForm.type==="BUY"?"#16a34a":"#dc2626"),padding:"13px 0",fontSize:14,borderRadius:10}}>
                {isEdit?"💾 บันทึกการแก้ไข":txForm.type==="BUY"?"✅ บันทึกการซื้อ":"🔴 บันทึกการขาย"}
              </button>

            </>:<>
              {/* DEPOSIT / WITHDRAW */}
              <div style={{display:"flex",gap:6,marginBottom:12}}>
                {[["DEPOSIT","ฝาก/โอนเข้า","#6366f1"],["WITHDRAW","ถอน/โอนออก","#dc2626"]].map(([t,l,clr])=>(
                  <button key={t} onClick={()=>setTxForm(f=>({...f,type:t}))}
                    style={{flex:1,background:txForm.type===t?`${clr}15`:"#f8fafc",border:`1.5px solid ${txForm.type===t?clr:C.border}`,color:txForm.type===t?clr:C.muted,borderRadius:8,padding:"9px 0",cursor:"pointer",fontWeight:800,fontSize:13,fontFamily:"inherit"}}>{l}</button>
                ))}
              </div>
              <div style={{marginBottom:12}}>
                <label style={lbl}>จำนวนเงิน (฿)</label>
                <input type="number" placeholder="50000" value={txForm.amount} onChange={e=>setTxForm(f=>({...f,amount:e.target.value}))} style={{...inp,fontSize:16,fontFamily:"'DM Mono',monospace"}}/>
              </div>
              <div style={{marginBottom:12}}>
                <label style={lbl}>หมายเหตุ (ไม่บังคับ)</label>
                <input placeholder="เช่น โอนเพิ่มทุน Q2" value={txForm.note} onChange={e=>setTxForm(f=>({...f,note:e.target.value}))} style={inp}/>
              </div>
              {txForm.amount&&<div style={{fontSize:12,marginBottom:14,padding:"10px 14px",background:txForm.type==="DEPOSIT"?"#f0f4ff":"#fff0f0",border:`1px solid ${txForm.type==="DEPOSIT"?"#c7d2fe":"#fecaca"}`,borderRadius:8,display:"flex",justifyContent:"space-between"}}>
                <span style={{color:C.sub}}>{txForm.type==="DEPOSIT"?"เพิ่ม Cash ใน":"ลด Cash ใน"} {ports.find(p=>p.id===txForm.portId)?.label}</span>
                <strong style={{color:txForm.type==="DEPOSIT"?"#6366f1":"#dc2626",fontFamily:"'DM Mono',monospace"}}>{txForm.type==="DEPOSIT"?"+":"-"}฿{fmt(parseFloat(txForm.amount||0))}</strong>
              </div>}
              <button onClick={()=>{addTx();setModal(null);}} style={{width:"100%",...btn(txForm.type==="DEPOSIT"?"#6366f1":"#dc2626"),padding:"13px 0",fontSize:14,borderRadius:10}}>
                {isEdit?"💾 บันทึกการแก้ไข":txForm.type==="DEPOSIT"?"💜 บันทึกการฝาก/โอนเข้า":"🔴 บันทึกการถอน/โอนออก"}
              </button>
            </>}
          </div>
        </div>
        );
      })()}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
