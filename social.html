<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

// ── Constants ────────────────────────────────────────────────────────────────
const SOCIAL_KEY = 'rc_social_v1';
const PORT_KEY   = 'port_v4';

const SOURCES = {
  pantip:        { label: 'Pantip',          icon: '🟡', cred: 4, color: '#f59e0b' },
  blockdit:      { label: 'Blockdit',        icon: '🟢', cred: 3, color: '#16a34a' },
  facebook_grp:  { label: 'Facebook Group',  icon: '🔵', cred: 2, color: '#3b82f6' },
  facebook_pg:   { label: 'Facebook Page',   icon: '🔵', cred: 3, color: '#2563eb' },
  twitter:       { label: 'X / Twitter',     icon: '⚫', cred: 3, color: '#334155' },
  google_rev:    { label: 'Google Review',   icon: '🔴', cred: 4, color: '#ef4444' },
  shopee_rev:    { label: 'Shopee Review',   icon: '🟠', cred: 3, color: '#f97316' },
  lazada_rev:    { label: 'Lazada Review',   icon: '🟣', cred: 3, color: '#8b5cf6' },
  news_official: { label: 'สำนักข่าว',       icon: '📰', cred: 5, color: '#0ea5e9' },
  youtube:       { label: 'YouTube',         icon: '▶️', cred: 3, color: '#dc2626' },
  manual:        { label: 'Manual',          icon: '✍️', cred: 1, color: '#94a3b8' },
};

const STORES = ['Advice', 'COM7 / BNN', 'Jmart / JMT', 'iStudio', 'Samsung Shop', 'TrueMove Store', 'AIS Store', 'อื่นๆ'];

const SENTIMENTS = {
  positive: { label: 'เชิงบวก', color: '#059669', bg: '#d1fae5', emoji: '👍' },
  neutral:  { label: 'กลางๆ',   color: '#d97706', bg: '#fef3c7', emoji: '😐' },
  negative: { label: 'เชิงลบ',  color: '#dc2626', bg: '#fee2e2', emoji: '👎' },
};

const TRAFFIC_SOURCES = {
  google_trends: { label: 'Google Trends (0–100)', desc: 'ดัชนีการค้นหา relative' },
  similarweb:    { label: 'SimilarWeb Visits',     desc: 'Monthly visits (พัน)' },
  app_downloads: { label: 'App Downloads',          desc: 'ยอด download (พัน/เดือน)' },
  google_reviews:{ label: 'New Google Reviews',     desc: 'จำนวน review ใหม่/เดือน' },
  shopee_sales:  { label: 'Shopee Sales Rank',      desc: 'อันดับหมวดสินค้า Shopee' },
  manual_count:  { label: 'Manual Count',           desc: 'ลูกค้าที่สังเกตได้/ชั่วโมง' },
};

const DEFAULT_STOCKS = ['ADVICE', 'COM7', 'JMART'];

// ── Storage ──────────────────────────────────────────────────────────────────
const mkStock = () => ({ prices: [], sentiments: [], traffic: [], news: [] });

const loadData = () => {
  try {
    const raw = localStorage.getItem(SOCIAL_KEY);
    if (raw) return JSON.parse(raw);
  } catch {}
  // seed tracked stocks from portfolio if available
  let stocks = [...DEFAULT_STOCKS];
  try {
    const port = JSON.parse(localStorage.getItem(PORT_KEY) || 'null');
    if (port && port.ports) {
      const syms = new Set();
      port.ports.forEach(p => (p.holdings || []).forEach(h => syms.add(h.symbol)));
      if (syms.size) stocks = [...syms].slice(0, 12);
    }
  } catch {}
  const data = {
    config: {
      trackedStocks: stocks,
      products: ['iPhone 17 128GB', 'iPhone 17 Pro 256GB', 'iPhone 17 Pro Max 256GB',
                 'Samsung S25 Ultra', 'Notebook Gaming RTX 4060', 'Smart TV 55" 4K'],
    },
    stocks: Object.fromEntries(stocks.map(s => [s, mkStock()])),
  };
  return data;
};

const saveData = d => {
  try { localStorage.setItem(SOCIAL_KEY, JSON.stringify(d)); } catch {}
};

// ── Helpers ──────────────────────────────────────────────────────────────────
const uid   = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
const fmtN  = n  => (+(n) || 0).toLocaleString('th-TH');
const fmtDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' }) : '';
const today = () => new Date().toISOString().slice(0, 10);

// Credibility-weighted sentiment score: -100 to +100
const calcSentScore = (items) => {
  if (!items || items.length === 0) return null;
  let wSum = 0, wTotal = 0;
  items.forEach(s => {
    const w = (SOURCES[s.source]?.cred || 1) * Math.max(1, Number(s.feedbackCount) || 1);
    const v = s.sentiment === 'positive' ? 1 : s.sentiment === 'negative' ? -1 : 0;
    wSum += v * w; wTotal += w;
  });
  return wTotal > 0 ? Math.round((wSum / wTotal) * 100) : 0;
};

// ── Primitive UI ──────────────────────────────────────────────────────────────

const C = { bg: '#f8fafc', card: '#fff', border: '#e2e8f0', text: '#0f172a',
             sub: '#475569', muted: '#94a3b8', indigo: '#6366f1' };

const Card = ({ children, style }) => (
  <div style={{ background: C.card, borderRadius: 14, border: `1px solid ${C.border}`,
    padding: 20, boxShadow: '0 1px 3px rgba(0,0,0,.04)', ...style }}>
    {children}
  </div>
);

const SH = ({ title, sub, right }) => (
  <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', marginBottom: 14 }}>
    <div>
      <div style={{ fontSize: 14, fontWeight: 700, color: C.text }}>{title}</div>
      {sub && <div style={{ fontSize: 11, color: C.muted, marginTop: 2 }}>{sub}</div>}
    </div>
    {right && <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>{right}</div>}
  </div>
);

const Btn = ({ onClick, children, v = 'primary', sm, disabled }) => {
  const s = {
    primary: { background: C.indigo, color: '#fff', border: 'none' },
    outline:  { background: 'transparent', color: C.indigo, border: `1px solid ${C.indigo}` },
    ghost:    { background: 'transparent', color: C.sub, border: 'none' },
    danger:   { background: 'transparent', color: '#dc2626', border: '1px solid #dc2626' },
  }[v] || {};
  return (
    <button onClick={onClick} disabled={disabled}
      style={{ ...s, padding: sm ? '4px 12px' : '8px 18px', borderRadius: 8,
        fontSize: sm ? 12 : 14, fontWeight: 600, cursor: disabled ? 'default' : 'pointer',
        fontFamily: 'inherit', opacity: disabled ? .5 : 1, flexShrink: 0 }}>
      {children}
    </button>
  );
};

const Inp = ({ value, onChange, placeholder, type = 'text', style }) => (
  <input type={type} value={value ?? ''} onChange={e => onChange(e.target.value)}
    placeholder={placeholder}
    style={{ border: `1px solid ${C.border}`, borderRadius: 8, padding: '8px 12px',
      fontSize: 13, fontFamily: 'inherit', width: '100%', background: '#fff', ...style }} />
);

const Sel = ({ value, onChange, children, style }) => (
  <select value={value} onChange={e => onChange(e.target.value)}
    style={{ border: `1px solid ${C.border}`, borderRadius: 8, padding: '8px 12px',
      fontSize: 13, fontFamily: 'inherit', background: '#fff', cursor: 'pointer',
      width: '100%', ...style }}>
    {children}
  </select>
);

const Tag = ({ text, color, bg, size = 12 }) => (
  <span style={{ padding: `2px 8px`, borderRadius: 999, background: bg, color,
    fontSize: size, fontWeight: 700, flexShrink: 0 }}>{text}</span>
);

const SignalBadge = ({ score, size = 'sm' }) => {
  let label, color, bg;
  if (score === null || score === undefined) { label = 'ไม่มีข้อมูล'; color = C.muted; bg = '#f1f5f9'; }
  else if (score >= 30)  { label = '▲ เชิงบวก'; color = '#059669'; bg = '#d1fae5'; }
  else if (score >= -30) { label = '◆ กลางๆ';   color = '#d97706'; bg = '#fef3c7'; }
  else                   { label = '▼ เชิงลบ'; color = '#dc2626'; bg = '#fee2e2'; }
  const pad = size === 'lg' ? '7px 18px' : '3px 10px';
  return <span style={{ padding: pad, borderRadius: 999, background: bg, color,
    fontSize: size === 'lg' ? 15 : 12, fontWeight: 700 }}>{label}</span>;
};

const Gauge = ({ score }) => {
  if (score === null) return <div style={{ color: C.muted, textAlign: 'center', padding: '12px 0', fontSize: 13 }}>ยังไม่มีข้อมูล</div>;
  const pct = Math.max(0, Math.min(100, ((score + 100) / 200) * 100));
  const color = score >= 30 ? '#10b981' : score >= -30 ? '#f59e0b' : '#ef4444';
  return (
    <div>
      <div style={{ height: 10, background: '#e2e8f0', borderRadius: 5, overflow: 'hidden', marginBottom: 5 }}>
        <div style={{ height: '100%', width: `${pct}%`,
          background: 'linear-gradient(90deg,#ef4444 0%,#f59e0b 50%,#10b981 100%)',
          borderRadius: 5, transition: 'width .5s ease' }} />
      </div>
      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11, color: C.muted }}>
        <span>เชิงลบ -100</span>
        <span style={{ color, fontWeight: 800, fontSize: 18 }}>{score > 0 ? '+' : ''}{score}</span>
        <span>+100 เชิงบวก</span>
      </div>
    </div>
  );
};

// ── Form wrapper ──────────────────────────────────────────────────────────────
const FormBox = ({ children, onSave, onCancel, title }) => (
  <div style={{ background: '#f8fafc', border: `1px solid ${C.border}`, borderRadius: 12,
    padding: 16, marginBottom: 20, animation: 'fadeUp .15s ease' }}>
    {title && <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 12 }}>{title}</div>}
    {children}
    <div style={{ marginTop: 14, display: 'flex', gap: 8 }}>
      <Btn onClick={onSave}>💾 บันทึก</Btn>
      <Btn onClick={onCancel} v="ghost">ยกเลิก</Btn>
    </div>
  </div>
);

const Grid2 = ({ children, style }) => (
  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, ...style }}>{children}</div>
);

const FLabel = ({ children }) => (
  <div style={{ fontSize: 11, fontWeight: 600, color: C.sub, marginBottom: 4, textTransform: 'uppercase', letterSpacing: .5 }}>{children}</div>

// ── Overview Tab ──────────────────────────────────────────────────────────────

// ── Price Monitor Tab ─────────────────────────────────────────────────────────
const PriceTab = ({ data, setData, stock }) => {
  const [showForm, setShowForm] = useState(false);
  const [filterProd, setFilterProd] = useState('all');
  const [form, setForm] = useState({
    product: '', store: STORES[0], price: '', promo: '',
    warranty: '', url: '', date: today(), note: '',
  });

  const sd     = data.stocks[stock] || mkStock();
  const prices = sd.prices || [];
  const prods  = [...new Set(prices.map(p => p.product))];
  const filtered = filterProd === 'all' ? prices : prices.filter(p => p.product === filterProd);

  const addPrice = () => {
    const p = parseFloat(form.price);
    if (!form.product.trim() || !p) return;
    const updated = { ...data };
    if (!updated.stocks[stock]) updated.stocks[stock] = mkStock();
    updated.stocks[stock] = {
      ...updated.stocks[stock],
      prices: [...(updated.stocks[stock].prices || []), { ...form, id: uid(), price: p }],
    };
    setData(updated); saveData(updated);
    setShowForm(false);
    setForm(f => ({ ...f, price: '', promo: '', warranty: '', url: '', note: '' }));
  };

  const del = id => {
    const updated = { ...data };
    updated.stocks[stock].prices = updated.stocks[stock].prices.filter(p => p.id !== id);
    setData(updated); saveData(updated);
  };

  // Group by product for comparison table
  const grouped = {};
  filtered.forEach(p => {
    if (!grouped[p.product]) grouped[p.product] = [];
    grouped[p.product].push(p);
  });

  return (
    <div style={{ display: 'grid', gap: 20, animation: 'fadeUp .2s ease' }}>
      <Card>
        <SH title="ราคา & โปรโมชั่น" sub={`${stock} · ${prices.length} รายการ · เปรียบเทียบร้านค้า`}
          right={<>
            <Sel value={filterProd} onChange={setFilterProd} style={{ width: 'auto', minWidth: 140 }}>
              <option value="all">ทุกสินค้า ({prices.length})</option>
              {prods.map(p => <option key={p} value={p}>{p}</option>)}
            </Sel>
            <Btn onClick={() => setShowForm(v => !v)} sm>{showForm ? '✕ ยกเลิก' : '+ เพิ่มราคา'}</Btn>
          </>}
        />

        {showForm && (
          <FormBox title="เพิ่มข้อมูลราคา" onSave={addPrice} onCancel={() => setShowForm(false)}>
            <Grid2>
              <div>
                <FLabel>สินค้า *</FLabel>
                <Inp value={form.product} onChange={v => setForm(f => ({ ...f, product: v }))}
                  placeholder="เช่น iPhone 17 128GB" />
                {data.config.products.length > 0 && (
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 4, marginTop: 6 }}>
                    {data.config.products.map(p => (
                      <button key={p} onClick={() => setForm(f => ({ ...f, product: p }))}
                        style={{ fontSize: 10, padding: '2px 8px', border: `1px solid ${C.border}`,
                          borderRadius: 999, background: form.product === p ? C.indigo : '#f8fafc',
                          color: form.product === p ? '#fff' : C.sub, cursor: 'pointer', fontFamily: 'inherit' }}>
                        {p}
                      </button>
                    ))}
                  </div>
                )}
              </div>
              <div>
                <FLabel>ร้านค้า</FLabel>
                <Sel value={form.store} onChange={v => setForm(f => ({ ...f, store: v }))}>
                  {STORES.map(s => <option key={s} value={s}>{s}</option>)}
                </Sel>
              </div>
              <div>
                <FLabel>ราคา (บาท) *</FLabel>
                <Inp type="number" value={form.price} onChange={v => setForm(f => ({ ...f, price: v }))}
                  placeholder="35900" />
              </div>
              <div>
                <FLabel>วันที่</FLabel>
                <Inp type="date" value={form.date} onChange={v => setForm(f => ({ ...f, date: v }))} />
              </div>
              <div>
                <FLabel>โปรโมชั่น</FLabel>
                <Inp value={form.promo} onChange={v => setForm(f => ({ ...f, promo: v }))}
                  placeholder="เช่น ผ่อน 0% 10 เดือน" />
              </div>
              <div>
                <FLabel>ประกัน</FLabel>
                <Inp value={form.warranty} onChange={v => setForm(f => ({ ...f, warranty: v }))}
                  placeholder="เช่น 1 ปีศูนย์ + 1 ปีร้าน" />
              </div>
              <div style={{ gridColumn: '1/-1' }}>
                <FLabel>URL สินค้า</FLabel>
                <Inp value={form.url} onChange={v => setForm(f => ({ ...f, url: v }))}
                  placeholder="https://www.advice.co.th/..." />
              </div>
              <div style={{ gridColumn: '1/-1' }}>
                <FLabel>หมายเหตุ</FLabel>
                <Inp value={form.note} onChange={v => setForm(f => ({ ...f, note: v }))}
                  placeholder="เงื่อนไข บังคับซื้อประกัน ฯลฯ" />
              </div>
            </Grid2>
          </FormBox>
        )}

        {filtered.length === 0 ? (
          <div style={{ textAlign: 'center', color: C.muted, padding: '40px 0', fontSize: 13 }}>
            ยังไม่มีข้อมูลราคา · กด <strong>+ เพิ่มราคา</strong> เพื่อเริ่มต้น
          </div>
        ) : (
          Object.entries(grouped).map(([prod, rows]) => {
            const allPrices  = rows.map(r => r.price);
            const minPrice   = Math.min(...allPrices);
            const maxPrice   = Math.max(...allPrices);
            const spread     = maxPrice - minPrice;
            const spreadPct  = minPrice > 0 ? ((spread / minPrice) * 100).toFixed(1) : 0;
            return (
              <div key={prod} style={{ marginBottom: 28 }}>
                <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 10, padding: '7px 14px',
                  background: '#f1f5f9', borderRadius: 8, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <span>📱 {prod}</span>
                  {spread > 0 && (
                    <span style={{ fontSize: 11, color: C.sub }}>
                      ราคาต่างกัน <strong>฿{fmtN(spread)}</strong> ({spreadPct}%)
                    </span>
                  )}
                </div>
                <div style={{ overflowX: 'auto' }}>
                  <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>
                    <thead>
                      <tr>
                        {['ร้าน', 'ราคา', 'โปร', 'ประกัน', 'วันที่', 'หมายเหตุ', ''].map(h => (
                          <th key={h} style={{ padding: '8px 12px', textAlign: 'left', color: C.muted,
                            fontWeight: 600, fontSize: 11, borderBottom: `1px solid ${C.border}`,
                            whiteSpace: 'nowrap', background: '#fff' }}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {rows.sort((a, b) => a.price - b.price).map(r => (
                        <tr key={r.id} style={{ borderBottom: `1px solid #f1f5f9` }}>
                          <td style={{ padding: '10px 12px', fontWeight: 600 }}>{r.store}</td>
                          <td style={{ padding: '10px 12px' }}>
                            <span style={{ fontWeight: 800, fontFamily: 'DM Mono,monospace',
                              color: r.price === minPrice ? '#059669' : C.text }}>
                              ฿{fmtN(r.price)}
                            </span>
                            {r.price === minPrice && rows.length > 1 && (
                              <span style={{ marginLeft: 6, fontSize: 10, background: '#d1fae5',
                                color: '#059669', padding: '1px 6px', borderRadius: 4, fontWeight: 700 }}>ถูกสุด</span>
                            )}
                          </td>
                          <td style={{ padding: '10px 12px', color: r.promo ? C.indigo : C.muted }}>{r.promo || '–'}</td>
                          <td style={{ padding: '10px 12px', color: C.sub }}>{r.warranty || '–'}</td>
                          <td style={{ padding: '10px 12px', color: C.muted, whiteSpace: 'nowrap', fontSize: 11 }}>{fmtDate(r.date)}</td>
                          <td style={{ padding: '10px 12px', color: C.muted, fontSize: 11 }}>{r.note || '–'}</td>
                          <td style={{ padding: '10px 12px' }}>
                            <div style={{ display: 'flex', gap: 8 }}>
                              {r.url && <a href={r.url} target="_blank" rel="noopener noreferrer"
                                style={{ fontSize: 11, color: C.indigo, textDecoration: 'none' }}>↗ ลิงก์</a>}
                              <button onClick={() => del(r.id)}
                                style={{ fontSize: 11, color: '#ef4444', background: 'none',
                                  border: 'none', cursor: 'pointer', padding: 0 }}>ลบ</button>
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            );
          })
        )}
      </Card>

      {/* Insight */}
      {filtered.length >= 2 && (() => {
        const byStore = {};
        filtered.forEach(p => { byStore[p.store] = byStore[p.store] || []; byStore[p.store].push(p.price); });
        const storeAvgs = Object.entries(byStore).map(([s, ps]) => ({ store: s, avg: ps.reduce((a,b) => a+b,0)/ps.length }))
          .sort((a,b) => a.avg - b.avg);
        const minS = storeAvgs[0];
        const maxS = storeAvgs[storeAvgs.length - 1];
        return (
          <Card style={{ borderLeft: `4px solid ${C.indigo}` }}>
            <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 8 }}>💡 สรุปการแข่งขันด้านราคา</div>
            <div style={{ fontSize: 13, color: C.sub, lineHeight: 2 }}>
              <div>🏆 ร้านถูกสุดโดยเฉลี่ย: <strong style={{ color: '#059669' }}>{minS.store}</strong> (฿{fmtN(Math.round(minS.avg))} เฉลี่ย)</div>
              <div>📈 ร้านแพงสุดโดยเฉลี่ย: <strong>{maxS.store}</strong> (฿{fmtN(Math.round(maxS.avg))} เฉลี่ย)</div>
              <div>📊 ส่วนต่างราคาตลาด: <strong>฿{fmtN(Math.round(maxS.avg - minS.avg))}</strong> ({((maxS.avg - minS.avg)/minS.avg*100).toFixed(1)}%)</div>
            </div>
          </Card>
        );
      })()}
    </div>
  );
};

// ── Sentiment Tab ─────────────────────────────────────────────────────────────
const SentimentTab = ({ data, setData, stock }) => {
  const [showForm, setShowForm] = useState(false);
  const [filterSrc, setFilterSrc] = useState('all');
  const [filterSent, setFilterSent] = useState('all');
  const [form, setForm] = useState({
    source: 'pantip', sentiment: 'positive', title: '',
    url: '', feedbackCount: '', date: today(), note: '',
  });

  const sd  = data.stocks[stock] || mkStock();
  const all = sd.sentiments || [];
  const score = calcSentScore(all);

  const filtered = all.filter(s =>
    (filterSrc === 'all' || s.source === filterSrc) &&
    (filterSent === 'all' || s.sentiment === filterSent)
  );

  const add = () => {
    if (!form.title.trim()) return;
    const updated = { ...data };
    if (!updated.stocks[stock]) updated.stocks[stock] = mkStock();
    updated.stocks[stock].sentiments = [
      ...(updated.stocks[stock].sentiments || []),
      { ...form, id: uid(), feedbackCount: Math.max(1, Number(form.feedbackCount) || 1) },
    ];
    setData(updated); saveData(updated);
    setShowForm(false);
    setForm(f => ({ ...f, title: '', url: '', feedbackCount: '', note: '' }));
  };

  const del = id => {
    const updated = { ...data };
    updated.stocks[stock].sentiments = updated.stocks[stock].sentiments.filter(s => s.id !== id);
    setData(updated); saveData(updated);
  };

  const srcCount = {};
  all.forEach(s => { srcCount[s.source] = (srcCount[s.source] || 0) + 1; });
  const sentCount = { positive: 0, neutral: 0, negative: 0 };
  all.forEach(s => { if (sentCount[s.sentiment] !== undefined) sentCount[s.sentiment]++; });

const TrafficTab = ({ data, setData, stock }) => {

  const [form, setForm] = useState({
    source: 'google_trends', value: '', date: today(), note: '',
  });

  const sd      = data.stocks[stock] || mkStock();
  const traffic = sd.traffic || [];

  const add = () => {
    const v = parseFloat(form.value);
    if (!v && v !== 0) return;
    const updated = { ...data };
    if (!updated.stocks[stock]) updated.stocks[stock] = mkStock();
    updated.stocks[stock].traffic = [
      ...(updated.stocks[stock].traffic || []),
      { ...form, id: uid(), value: v },
    ];
    setData(updated); saveData(updated);
    setShowForm(false);
    setForm(f => ({ ...f, value: '', note: '' }));
  };

  const del = id => {
    const updated = { ...data };
    updated.stocks[stock].traffic = updated.stocks[stock].traffic.filter(t => t.id !== id);
    setData(updated); saveData(updated);
  };

  const maxVal  = traffic.length ? Math.max(...traffic.map(t => t.value), 1) : 100;
  const lastVal = traffic.slice(-1)[0];
  const trafficColor = v => v >= 65 ? '#10b981' : v >= 35 ? '#f59e0b' : '#ef4444';

          <iframe
            key={activeKw}

          💡 ถ้า embed ไม่โหลด → เปิด <a href={`https://trends.google.com/trends/explore?q=${encodeURIComponent(activeKw)}&geo=TH`}
            target="_blank" rel="noopener noreferrer" style={{ color: C.indigo }}>Google Trends ตรง</a> ในแท็บใหม่
          · ดูค่า 0-100 แล้วบันทึกด้านล่าง
        </div>
      </Card>

      {/* Traffic Methods */}
      <Card>
        <SH title="วิธีวัด Store Traffic" sub="Proxy methods สำหรับ retail foot traffic — จากง่ายไปยาก" />
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(230px,1fr))', gap: 12 }}>
          {[
            { icon: '🔍', method: 'Google Trends', access: 'ฟรี', rel: 3,
              note: 'ค้นหาชื่อแบรนด์เป็น proxy consumer interest · ไม่แม่นยำ 100% แต่ทำได้ทันที' },
            { icon: '⭐', method: 'Google Maps Reviews', access: 'ฟรี', rel: 3,

            { icon: '📍', method: 'Google Popular Times', access: 'ฟรี (ไม่มี API)', rel: 4,

            { icon: '🌐', method: 'SimilarWeb', access: 'ฟรี (จำกัด)', rel: 3,

// ── Config Panel ──────────────────────────────────────────────────────────────
const ConfigPanel = ({ data, setData, setStock }) => {
  const [ns, setNs] = useState('');
  const [np, setNp] = useState('');
  const stocks   = data.config.trackedStocks;
  const products = data.config.products;

  const addStock = () => {
    const sym = ns.toUpperCase().trim();
    if (!sym || stocks.includes(sym)) return;
    const updated = { ...data,
      config: { ...data.config, trackedStocks: [...stocks, sym] },
      stocks: { ...data.stocks, [sym]: data.stocks[sym] || mkStock() },
    };
    setData(updated); saveData(updated);
    setNs(''); setStock(sym);
  };

  const removeStock = sym => {
    if (stocks.length <= 1) return;
    const updated = { ...data, config: { ...data.config, trackedStocks: stocks.filter(s => s !== sym) } };
    setData(updated); saveData(updated);
    setStock(updated.config.trackedStocks[0]);
  };

  const addProduct = () => {
    const p = np.trim();
    if (!p || products.includes(p)) return;
    const updated = { ...data, config: { ...data.config, products: [...products, p] } };
    setData(updated); saveData(updated); setNp('');
  };

  const removeProduct = p => {
    const updated = { ...data, config: { ...data.config, products: products.filter(x => x !== p) } };
    setData(updated); saveData(updated);
  };

  const exportJson = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `social_listening_${today()}.json`;
    a.click();
  };

  const fileRef = useRef();
  const importJson = e => {
    const f = e.target.files?.[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const d = JSON.parse(ev.target.result);
        setData(d); saveData(d);
      } catch { alert('ไฟล์ไม่ถูกต้อง'); }
    };
    r.readAsText(f);
  };

  return (
    <div style={{ background: '#fff', borderBottom: `1px solid ${C.border}`, padding: '14px 24px',
      animation: 'fadeUp .15s ease' }}>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(220px,1fr))', gap: 20, maxWidth: 1100 }}>
        {/* Stocks */}
        <div>
          <FLabel>จัดการหุ้น</FLabel>
          <div style={{ display: 'flex', gap: 6, marginBottom: 8 }}>
            <Inp value={ns} onChange={setNs} placeholder="เช่น DOHOME" style={{ flex: 1 }} />
            <Btn onClick={addStock} sm>เพิ่ม</Btn>
          </div>
          <div style={{ display: 'flex', gap: 5, flexWrap: 'wrap' }}>
            {stocks.map(s => (
              <span key={s} style={{ fontSize: 12, padding: '3px 10px', background: '#f1f5f9',
                borderRadius: 999, display: 'flex', alignItems: 'center', gap: 4 }}>
                {s}
                {stocks.length > 1 && (
                  <button onClick={() => removeStock(s)}
                    style={{ background: 'none', border: 'none', cursor: 'pointer', color: C.muted, fontSize: 11, padding: 0 }}>✕</button>
                )}
              </span>
            ))}
          </div>
        </div>
        {/* Products */}
        <div>
          <FLabel>จัดการสินค้า ({products.length})</FLabel>
          <div style={{ display: 'flex', gap: 6, marginBottom: 8 }}>
            <Inp value={np} onChange={setNp} placeholder="เช่น iPhone 17 Pro Max" style={{ flex: 1 }} />
            <Btn onClick={addProduct} sm>เพิ่ม</Btn>
          </div>
          <div style={{ display: 'flex', gap: 5, flexWrap: 'wrap', maxHeight: 80, overflowY: 'auto' }}>
            {products.map(p => (
              <span key={p} style={{ fontSize: 11, padding: '2px 8px', background: '#f1f5f9',
                borderRadius: 999, display: 'flex', alignItems: 'center', gap: 3 }}>
                {p}
                <button onClick={() => removeProduct(p)}
                  style={{ background: 'none', border: 'none', cursor: 'pointer', color: C.muted, fontSize: 10, padding: 0 }}>✕</button>
              </span>
            ))}
          </div>
        </div>
        {/* Export/Import */}
        <div>
          <FLabel>นำเข้า / ส่งออกข้อมูล</FLabel>
          <div style={{ display: 'flex', gap: 8 }}>
            <Btn onClick={exportJson} v="outline" sm>📤 Export JSON</Btn>
            <label style={{ padding: '4px 12px', borderRadius: 8, border: `1px solid ${C.border}`,
              fontSize: 12, cursor: 'pointer', fontWeight: 600, color: C.sub, background: '#fff',
              display: 'flex', alignItems: 'center' }}>
              📥 Import
              <input ref={fileRef} type="file" accept=".json" onChange={importJson} style={{ display: 'none' }} />
            </label>
          </div>
          <div style={{ fontSize: 11, color: C.muted, marginTop: 8 }}>
            ข้อมูลเก็บใน localStorage ของ browser
          </div>
        </div>
      </div>
    </div>
  );
};

// ── Main App ──────────────────────────────────────────────────────────────────
const TABS = [
  { id: 'overview',  label: 'ภาพรวม',     icon: '📊' },
  { id: 'price',     label: 'ราคา & โปร', icon: '💰' },
  { id: 'sentiment', label: 'Sentiment',   icon: '💬' },
  { id: 'news',      label: 'ข่าวสาร',    icon: '📰' },
  { id: 'traffic',   label: 'Traffic',     icon: '📈' },
];

const App = () => {
  const [data, setData] = useState(() => loadData());
  const [tab,  setTab]  = useState('overview');
  const [stock, setStock] = useState(() => {
    try {
      const d = JSON.parse(localStorage.getItem(SOCIAL_KEY) || 'null');
      return d?.config?.trackedStocks?.[0] || DEFAULT_STOCKS[0];
    } catch { return DEFAULT_STOCKS[0]; }
  });
  const [showConfig, setShowConfig] = useState(false);

  // keep stock valid after config changes
  useEffect(() => {
    if (!data.config.trackedStocks.includes(stock)) {
      setStock(data.config.trackedStocks[0] || DEFAULT_STOCKS[0]);
    }
  }, [data.config.trackedStocks]);

  // ensure stock data slot exists
  const stocks = data.config.trackedStocks;

  return (
    <div style={{ minHeight: '100vh', background: C.bg,
      fontFamily: "'DM Sans','Noto Sans Thai',sans-serif", color: C.text }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');
        *{box-sizing:border-box}
      `}</style>

      {/* TOPBAR */}
      <div style={{ background: '#fff', borderBottom: `1px solid ${C.border}`,
        position: 'sticky', top: 0, zIndex: 100,
        boxShadow: '0 1px 3px rgba(0,0,0,.05)' }}>
        <div style={{ maxWidth: 1200, margin: '0 auto', padding: '0 24px',
          display: 'flex', alignItems: 'center', gap: 14, height: 56 }}>
          {/* Logo + Back */}
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <div style={{ width: 32, height: 32, borderRadius: 8,
              background: 'linear-gradient(135deg,#6366f1,#8b5cf6)',
              display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 15 }}>📡</div>
            <div>
              <div style={{ fontSize: 13, fontWeight: 800, letterSpacing: -.3 }}>SOCIAL LISTENING</div>
              <div style={{ fontSize: 9, color: C.muted, letterSpacing: .5 }}>REDCODE DASHBOARD</div>
            </div>
          </div>

          <div style={{ width: 1, height: 22, background: C.border }} />

          <a href="index.html" style={{ fontSize: 12, color: C.indigo, textDecoration: 'none',
            display: 'flex', alignItems: 'center', gap: 4, fontWeight: 600 }}>
            ← Portfolio
          </a>

          {/* Stock Pills */}
          <div style={{ display: 'flex', gap: 5, marginLeft: 4 }}>
            {stocks.map(s => (
              <button key={s} onClick={() => setStock(s)}
                style={{ padding: '4px 14px', borderRadius: 999, border: 'none', cursor: 'pointer',
                  fontFamily: 'inherit', fontWeight: 700, fontSize: 12, transition: 'all .15s',
                  background: s === stock ? C.indigo : '#f1f5f9',
                  color: s === stock ? '#fff' : C.sub }}>
                {s}
              </button>
            ))}
          </div>

          <div style={{ flex: 1 }} />

          <button onClick={() => setShowConfig(v => !v)}
            style={{ background: 'none', border: `1px solid ${C.border}`, borderRadius: 8,
              padding: '6px 14px', cursor: 'pointer', fontSize: 12, color: C.sub,
              fontFamily: 'inherit', fontWeight: 600 }}>
            ⚙️ ตั้งค่า
          </button>
        </div>

        {/* Config Panel */}
        {showConfig && <ConfigPanel data={data} setData={setData} setStock={setStock} />}

        {/* TAB BAR */}
        <div style={{ borderTop: `1px solid ${C.border}`, background: '#fff' }}>
          <div style={{ maxWidth: 1200, margin: '0 auto', padding: '0 24px', display: 'flex', gap: 0 }}>
            {TABS.map(t => (
              <button key={t.id} onClick={() => setTab(t.id)}
                style={{ padding: '12px 20px', border: 'none', background: 'none', cursor: 'pointer',
                  fontFamily: 'inherit', fontSize: 13, fontWeight: 600, transition: 'all .15s',
                  color: t.id === tab ? C.indigo : C.muted,
                  borderBottom: `2px solid ${t.id === tab ? C.indigo : 'transparent'}`,
                  display: 'flex', alignItems: 'center', gap: 5 }}>
                {t.icon} {t.label}
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* CONTENT */}
      <div style={{ maxWidth: 1200, margin: '0 auto', padding: '24px 24px 48px' }}>
        {tab === 'overview'  && <OverviewTab  data={data} stock={stock} />}
        {tab === 'price'     && <PriceTab     data={data} setData={setData} stock={stock} />}
        {tab === 'sentiment' && <SentimentTab data={data} setData={setData} stock={stock} />}
        {tab === 'news'      && <NewsTab       data={data} setData={setData} stock={stock} />}
        {tab === 'traffic'   && <TrafficTab   data={data} setData={setData} stock={stock} />}
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
