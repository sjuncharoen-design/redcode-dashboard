  var ohlc = function(base,days){
    var r=[]; var p=base;
    for(var i=days;i>=1;i--){
      var d=new Date(); d.setDate(d.getDate()-i);
      // skip weekends
      if(d.getDay()===0||d.getDay()===6) continue;
      var chg=(Math.random()-0.48)*base*0.025;
      var o=Math.round(p*100)/100;
      p=Math.round((p+chg)*100)/100;
      var hi=Math.round(Math.max(o,p)*100+Math.random()*base*0.012*100)/100;
      var lo=Math.round(Math.min(o,p)*100-Math.random()*base*0.012*100)/100;
      r.push({id:id(),date:d.toISOString().slice(0,10),open:o,high:hi,low:lo,close:p,verified:true});
    }
    return r;
  };

const calcSentScore = items => {
  if (!items||!items.length) return null;
  let ws=0,wt=0;
  items.forEach(s=>{
    const w=(SOURCES[s.source]?.cred||1)*Math.max(1,Number(s.feedbackCount)||1);

  const latest = {};
  traffic.filter(t=>t.date>=cut).forEach(t=>{
    if (!latest[t.source]||t.date>latest[t.source].date) latest[t.source]=t;
  });
  let ws=0,wt=0; const breakdown=[];
  Object.entries(TRAFFIC_CFG).forEach(([src,cfg])=>{
    const e=latest[src]; if(!e) return;
    const norm = Math.min(100,Math.round((e.value/cfg.max)*100));
    breakdown.push({src,label:cfg.label,value:e.value,unit:cfg.unit,norm,w:cfg.w,date:e.date,verified:e.verified});
    ws+=norm*cfg.w; wt+=cfg.w;
  });
  const maxW = Object.values(TRAFFIC_CFG).reduce((a,b)=>a+b.w,0);
  return {
    score: wt>0 ? Math.round(ws/wt) : null,
    confidence: Math.round((wt/maxW)*100),
    breakdown,
  };
};

const getPromoTrend = prices => {
  const byWeek={};
  prices.filter(p=>p.promoScore).forEach(p=>{
    const d=new Date(p.date+'T00:00:00');
    const mon=new Date(d); mon.setDate(d.getDate()-((d.getDay()+6)%7));
    const wk=mon.toISOString().slice(0,10);
    if(!byWeek[wk]) byWeek[wk]=[];
    byWeek[wk].push({score:p.promoScore,store:p.store,promo:p.promo});
  });
  const weeks=Object.keys(byWeek).sort().slice(-8);
  const data=weeks.map(wk=>({
    week:wk,
    avg:byWeek[wk].reduce((a,b)=>a+b.score,0)/byWeek[wk].length,
    count:byWeek[wk].length,
    entries:byWeek[wk],
  }));
  const cur=data[data.length-1];
  const hist=data.slice(0,-1);
  const baseline=hist.length ? hist.reduce((a,w)=>a+w.avg,0)/hist.length : null;
  const alertLevel = (baseline&&cur) ? cur.avg/baseline : 1;
  return {data, cur, baseline, alertLevel};
};

// ── Price Trend SVG Chart ─────────────────────────────────────────────────────
const PriceTrendChart = ({ entries }) => {
  const valid = (entries||[]).filter(e=>e.price&&e.date&&e.store);
  if (valid.length < 2) return (
    <div style={{textAlign:'center',color:C.muted,padding:'20px 0',fontSize:12}}>
      ต้องมีข้อมูลราคาอย่างน้อย 2 วันขึ้นไปเพื่อแสดง trend
    </div>
  );

  const W=580, H=210;
  const PAD={t:14,r:90,b:38,l:58};
  const cW=W-PAD.l-PAD.r, cH=H-PAD.t-PAD.b;

  const sorted=[...valid].sort((a,b)=>a.date.localeCompare(b.date));
  const dates=[...new Set(sorted.map(e=>e.date))].sort();
  const stores=[...new Set(sorted.map(e=>e.store))];

  const allP=sorted.map(e=>e.price);
  const minP=Math.min(...allP), maxP=Math.max(...allP);
  const pad=(maxP-minP)*0.12||1000;
  const lo=minP-pad, hi=maxP+pad;

  const xOf = i => PAD.l+(dates.length>1?(i/(dates.length-1))*cW:cW/2);
  const yOf = p => PAD.t+(1-(p-lo)/(hi-lo))*cH;

  const yTicks=4;
  const yStep=(hi-lo)/yTicks;

  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',overflow:'visible'}}>
        {/* Chart background */}
        <rect x={PAD.l} y={PAD.t} width={cW} height={cH} fill="#f8fafc" rx={4}/>
        {/* Grid */}
        {Array.from({length:yTicks+1},(_,i)=>{
          const p=lo+i*yStep, y=yOf(p);
          return (
            <g key={i}>
              <line x1={PAD.l} y1={y} x2={PAD.l+cW} y2={y} stroke="#e2e8f0" strokeWidth={i===0?1.5:1} strokeDasharray={i>0&&i<yTicks?"3,3":""}/>
              <text x={PAD.l-6} y={y+4} textAnchor="end" fontSize={10} fill="#94a3b8">
                ฿{(p/1000).toFixed(0)}K
              </text>
            </g>
          );
        })}
        {/* X labels */}
        {dates.map((d,i)=>{
          if(dates.length>6&&i%2!==0&&i!==dates.length-1) return null;
          return <text key={d} x={xOf(i)} y={H-8} textAnchor="middle" fontSize={9} fill="#94a3b8">{d.slice(5).replace('-','/')}</text>;
        })}
        {/* Store lines */}
        {stores.map(store=>{
          const color=STORE_COLORS[store]||'#94a3b8';
          const pts=[];
          dates.forEach((d,i)=>{
            const m=sorted.filter(e=>e.store===store&&e.date===d);
            if(m.length) pts.push({x:xOf(i),y:yOf(m[0].price),price:m[0].price,d,verified:m[0].verified});
          });
          if(!pts.length) return null;
          return (
            <g key={store}>
              {pts.length>1&&<polyline points={pts.map(p=>`${p.x},${p.y}`).join(' ')} fill="none" stroke={color} strokeWidth={2.5} strokeLinejoin="round" strokeLinecap="round"/>}
              {pts.map((pt,i)=>(
                <g key={i}>
                  <circle cx={pt.x} cy={pt.y} r={pt.verified?4.5:3.5} fill={color} stroke="#fff" strokeWidth={2}/>
                  {!pt.verified&&<circle cx={pt.x} cy={pt.y} r={5.5} fill="none" stroke={color} strokeWidth={1} strokeDasharray="2,2"/>}
                  {i===pts.length-1&&(
                    <>
                      <rect x={pt.x+8} y={pt.y-11} width={64} height={20} rx={4} fill={color} opacity={.92}/>
                      <text x={pt.x+12} y={pt.y+2} fontSize={10} fill="#fff" fontWeight="700">฿{(pt.price/1000).toFixed(1)}K</text>
                    </>
                  )}
                </g>
              ))}
            </g>
          );
        })}
      </svg>
      {/* Legend */}
      <div style={{display:'flex',gap:14,flexWrap:'wrap',marginTop:6,paddingLeft:PAD.l}}>
        {stores.filter(s=>valid.some(e=>e.store===s)).map(s=>(
          <div key={s} style={{display:'flex',alignItems:'center',gap:5,fontSize:11}}>
            <div style={{width:20,height:3,borderRadius:2,background:STORE_COLORS[s]||'#94a3b8'}}/>
            <span style={{color:C.sub}}>{s}</span>
          </div>
        ))}
        <div style={{display:'flex',alignItems:'center',gap:5,fontSize:11,color:C.muted}}>
          <span>○ ยังไม่ยืนยัน</span>
        </div>
      </div>
    </div>
  );
};

  );

  const maxBar=5, barH=48;

  const isVeryHigh = alertLevel >= 1.5;

  // Find store with highest promo this week
  let topStore='', topScore=0;

    const byStore={};
    cur.entries.forEach(e=>{byStore[e.store]=(byStore[e.store]||0)+e.score;});

          </span>
          <span style={{color:C.sub,marginLeft:8}}>
            +{Math.round((alertLevel-1)*100)}% vs baseline {baseline?.toFixed(1)}
            {topStore&&<span> · <strong>{topStore}</strong> ทำโปรแรงที่สุด</span>}

              <div style={{fontSize:9,color:C.muted,textAlign:'center'}}>{w.week.slice(5).replace('-','/')}</div>

          );
        })}
      </div>
      {baseline&&(
        <div style={{fontSize:11,color:C.muted,marginTop:6}}>
          Baseline เฉลี่ย {baseline.toFixed(1)}/5 · สัปดาห์นี้ {cur?.avg.toFixed(1)}/5
          <span style={{marginLeft:12,display:'inline-flex',gap:6}}>

// ── Price Tab ─────────────────────────────────────────────────────────────────
const PriceTab = ({ data, setData, stock }) => {
  const [showForm, setShowForm] = useState(false);
  const [viewProd, setViewProd] = useState('all');
  const [form, setForm] = useState({
    product:'',store:STORES[0],price:'',promoScore:'3',promo:'',warranty:'',url:'',date:today(),note:'',verified:false,
  });

  const sd     = data.stocks[stock] || mkStock();
  const prices = sd.prices || [];
  const prods  = [...new Set(prices.map(p=>p.product))];

  // Top 3 by entry count
  const top3 = useMemo(()=>{
    const cnt={};
    prices.forEach(p=>{ cnt[p.product]=(cnt[p.product]||0)+1; });
    return Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]);
  },[prices]);

  const filtered = viewProd==='all' ? prices : prices.filter(p=>p.product===viewProd);
  const grouped  = {};
  filtered.forEach(p=>{ if(!grouped[p.product]) grouped[p.product]=[]; grouped[p.product].push(p); });

  const add = () => {
    const p=parseFloat(form.price);
    if(!form.product.trim()||!p) return;
    const updated={...data};
    if(!updated.stocks[stock]) updated.stocks[stock]=mkStock();
    updated.stocks[stock].prices=[...(updated.stocks[stock].prices||[]),{...form,id:uid(),price:p,promoScore:Number(form.promoScore)||3}];
    setData(updated); saveData(updated);
    setShowForm(false);
    setForm(f=>({...f,price:'',promo:'',warranty:'',url:'',note:'',verified:false}));
  };

  const del = id => {
    const updated={...data};
    updated.stocks[stock].prices=updated.stocks[stock].prices.filter(p=>p.id!==id);
    setData(updated); saveData(updated);
  };

  const toggleVerify = id => {
    const updated={...data};
    updated.stocks[stock].prices=updated.stocks[stock].prices.map(p=>p.id===id?{...p,verified:!p.verified}:p);
    setData(updated); saveData(updated);
  };

  const chartEntries = viewProd!=='all' ? prices.filter(p=>p.product===viewProd) : (top3.length?prices.filter(p=>p.product===top3[0]):[]);

  return (
    <div style={{display:'grid',gap:20,animation:'fadeUp .2s ease'}}>
      {/* Trend Chart */}
      {prices.length>=2&&(

          <SH title="Price Trend Chart" sub={`${viewProd==='all'?`Top 1: ${top3[0]||'–'}`:viewProd} · เส้นทึบ=ยืนยันแล้ว, เส้นประ=ยังไม่ยืนยัน`}
            right={
              <Sel value={viewProd} onChange={setViewProd} style={{width:'auto',minWidth:180}}>
                <option value="all">ทุกสินค้า (แสดง #{top3[0]})</option>
                {prods.map(p=><option key={p} value={p}>{p}</option>)}
              </Sel>
            }
          />
          <PriceTrendChart entries={chartEntries}/>
        </Card>
      )}

      {/* Promo Intensity */}
      {prices.length>0&&(
        <Card>
          <SH title="Promo Intensity Tracker" sub="สัปดาห์ที่มีโปรแรงกว่าปกติ = สัญญาณแข่งขันสูง"/>
          <PromoSection prices={prices} product={viewProd==='all'?null:viewProd}/>
        </Card>
      )}

      {/* Price Table */}
      <Card>
        <SH title="ตารางราคาเปรียบเทียบ"
          sub={`${stock} · ${prices.length} รายการ · ยืนยัน ${prices.filter(p=>p.verified).length}/${prices.length}`}
          right={<>
            <Sel value={viewProd} onChange={setViewProd} style={{width:'auto',minWidth:160}}>
              <option value="all">ทุกสินค้า</option>
              {prods.map(p=><option key={p} value={p}>{p}</option>)}
            </Sel>
            <Btn onClick={()=>setShowForm(v=>!v)} sm>{showForm?'✕ ยกเลิก':'+ เพิ่ม'}</Btn>
          </>}
        />

        {/* Top 3 pills */}
        {top3.length>0&&(
          <div style={{display:'flex',gap:6,marginBottom:14,flexWrap:'wrap'}}>
            <span style={{fontSize:11,color:C.muted,alignSelf:'center'}}>ขายดีสุด:</span>
            {top3.map((p,i)=>(
              <button key={p} onClick={()=>setViewProd(p)}
                style={{fontSize:11,padding:'3px 10px',borderRadius:999,border:`1px solid ${[C.indigo,'#10b981','#f59e0b'][i]}`,
                  background:viewProd===p?[C.indigo,'#10b981','#f59e0b'][i]:'transparent',
                  color:viewProd===p?'#fff':[C.indigo,'#10b981','#f59e0b'][i],cursor:'pointer',fontWeight:700,fontFamily:'inherit'}}>
                #{i+1} {p.split(' ').slice(0,2).join(' ')}
              </button>
            ))}
          </div>
        )}

        {showForm&&(

                    <button key={p} onClick={()=>setForm(f=>({...f,product:p}))}

                        background:form.product===p?C.indigo:'#f8fafc',color:form.product===p?'#fff':C.sub,cursor:'pointer',fontFamily:'inherit'}}>
                      {p}
                    </button>

              </div>
              <div>
                <FLabel>ร้านค้า</FLabel>

              <div>

                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            );
          })
        )}
      </Card>
    </div>
  );
};

  const add = () => {
    if(!form.title.trim()) return;

    updated.stocks[stock].sentiments=[...(updated.stocks[stock].sentiments||[]),{...form,id:uid(),feedbackCount:Math.max(1,Number(form.feedbackCount)||1)}];

    setData(updated); saveData(updated);

// ── Candlestick + Sentiment Overlay ──────────────────────────────────────────
const CandlestickTab = ({data, stock}) => {
  const sd = data.stocks?.[stock] || {};
  const candles = [...(sd.stockPrices||[])].sort((a,b)=>a.date.localeCompare(b.date)).slice(-20);
  const sentiments = sd.sentiments || [];

  // weekly sentiment score per date bucket
  const sentByDate = useMemo(()=>{
    if(!sentiments.length) return {};
    const CRED={pantip:4,facebook:2,facebook_grp:2,twitter:3,google_rev:4,google_reviews:4,official:5,news:5,news_official:5,tiktok:2,shopee_rev:3};
    const map={};
    sentiments.forEach(e=>{
      const d=e.date; if(!map[d]) map[d]={ws:0,wt:0};
      const c=CRED[e.source]||2, w=c*Math.max(1,e.feedbackCount||1);
      const v=e.sentiment==='positive'?1:e.sentiment==='negative'?-1:0;
      map[d].ws+=v*w; map[d].wt+=w;
    });
    return Object.fromEntries(Object.entries(map).map(([d,{ws,wt}])=>[d,Math.round(ws/wt*100)]));
  },[sentiments]);

  // SVG layout
  const W=580, H=280;
  const mL=54, mR=66, mT=16, mB=36;
  const cW=W-mL-mR, cH=H-mT-mB;

  if(!candles.length) return(
    <div style={{background:C.bg,borderRadius:12,border:`1px solid ${C.border}`,padding:'40px',textAlign:'center',color:C.muted}}>
      ยังไม่มีข้อมูลราคาหุ้น (OHLC) — ล้าง localStorage แล้วรีเฟรชเพื่อโหลด demo data ใหม่
    </div>
  );

  const n=candles.length;
  const slot=cW/n;
  const bW=Math.max(4,Math.floor(slot*0.55));

  const allPrices=candles.flatMap(c=>[c.high,c.low]);
  const prMin=Math.min(...allPrices), prMax=Math.max(...allPrices);
  const prPad=(prMax-prMin)*0.08;
  const yPr=v=>mT+cH-(v-(prMin-prPad))/((prMax+prPad)-(prMin-prPad))*cH;
  const xC=i=>mL+slot*(i+0.5);

  // sentiment points: for each candle date, find nearest sentiment entry (within 5 days before)
  const sentPoints=candles.map((c,i)=>{
    const d=c.date;
    const relevant=Object.entries(sentByDate).filter(([sd])=>sd<=d).sort(([a],[b])=>b.localeCompare(a));
    if(!relevant.length) return null;
    const s=relevant[0][1];
    const yS=mT+cH-((s+100)/200)*cH;
    return {x:xC(i),y:yS,score:s,date:d};
  }).filter(Boolean);

  const sentLine=sentPoints.map(p=>`${p.x},${p.y}`).join(' ');
  const sentColor='#38bdf8';

  // price Y axis ticks
  const prTicks=[];
  const step=Math.pow(10,Math.floor(Math.log10((prMax-prMin)/4)));
  const tickStart=Math.ceil((prMin-prPad)/step)*step;
  for(let v=tickStart;v<=prMax+prPad;v+=step){
    if(v<prMin-prPad||v>prMax+prPad) continue;
    prTicks.push({v,y:yPr(v)});
  }

  // date axis: show every 3rd candle
  const dateTicks=candles.filter((_,i)=>i%3===0).map((c,_,arr)=>{
    const i=candles.indexOf(c);
    const d=new Date(c.date+'T00:00:00');
    return {x:xC(i),label:`${d.getDate()}/${d.getMonth()+1}`};
  });

  const stockColor=C.indigo;

  return(
    <div style={{animation:'fadeUp .3s ease'}}>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16,flexWrap:'wrap'}}>
        <div>
          <div style={{fontSize:17,fontWeight:800,color:C.text}}>🕯️ Candlestick + Sentiment Overlay — {stock}</div>
          <div style={{fontSize:12,color:C.muted}}>ราคาหุ้น (OHLC) ซ้อนทับ Sentiment Score · {n} trading days</div>
        </div>
        <div style={{marginLeft:'auto',display:'flex',gap:14,fontSize:12,flexWrap:'wrap'}}>
          <span style={{display:'flex',alignItems:'center',gap:5}}>
            <span style={{width:12,height:12,background:'#22c55e',display:'inline-block',borderRadius:1}}/>
            <span style={{color:C.sub}}>ขึ้น (close&gt;open)</span>
          </span>
          <span style={{display:'flex',alignItems:'center',gap:5}}>
            <span style={{width:12,height:12,background:'#ef4444',display:'inline-block',borderRadius:1}}/>
            <span style={{color:C.sub}}>ลง (close&lt;open)</span>
          </span>
          <span style={{display:'flex',alignItems:'center',gap:5}}>
            <svg width="24" height="4"><line x1="0" y1="2" x2="24" y2="2" stroke={sentColor} strokeWidth="2" strokeDasharray="4,2"/></svg>
            <span style={{color:C.sub}}>Sentiment score</span>
          </span>
        </div>
      </div>

      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:'16px 8px 8px',overflow:'hidden'}}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',maxWidth:W,display:'block',margin:'0 auto'}}>

          {/* grid */}
          {prTicks.map((t,i)=>(
            <g key={i}>
              <line x1={mL} y1={t.y} x2={W-mR} y2={t.y} stroke={C.border} strokeWidth="0.6" strokeDasharray="4,3"/>
              <text x={mL-5} y={t.y+4} textAnchor="end" fontSize="10" fill={C.muted} fontFamily="DM Mono,monospace">{t.v.toFixed(2)}</text>
            </g>
          ))}

          {/* sentiment right axis labels */}
          {[-100,-50,0,50,100].map(v=>{
            const y=mT+cH-((v+100)/200)*cH;
            return(
              <g key={v}>
                <line x1={W-mR} y1={y} x2={W-mR+4} y2={y} stroke={sentColor} strokeWidth="0.7"/>
                <text x={W-mR+7} y={y+4} fontSize="9" fill={sentColor} fontFamily="DM Mono,monospace" opacity="0.8">
                  {v>0?`+${v}`:v}
                </text>
              </g>
            );
          })}

          {/* sentiment zero line */}
          <line x1={mL} y1={mT+cH*0.5} x2={W-mR} y2={mT+cH*0.5} stroke={sentColor} strokeWidth="0.5" strokeDasharray="2,4" opacity="0.3"/>

          {/* date axis */}
          {dateTicks.map((t,i)=>(
            <text key={i} x={t.x} y={H-mB+16} textAnchor="middle" fontSize="9.5" fill={C.muted} fontFamily="DM Sans,sans-serif">{t.label}</text>
          ))}

          {/* axes */}
          <line x1={mL} y1={mT} x2={mL} y2={mT+cH} stroke="#334155" strokeWidth="1"/>
          <line x1={mL} y1={mT+cH} x2={W-mR} y2={mT+cH} stroke="#334155" strokeWidth="1"/>
          <line x1={W-mR} y1={mT} x2={W-mR} y2={mT+cH} stroke={sentColor} strokeWidth="1" opacity="0.5"/>

          {/* candlesticks */}
          {candles.map((c,i)=>{
            const up=c.close>=c.open;
            const fill=up?'#22c55e':'#ef4444';
            const cx=xC(i);
            const yO=yPr(c.open), yC=yPr(c.close), yH=yPr(c.high), yL=yPr(c.low);
            const bTop=Math.min(yO,yC), bBot=Math.max(yO,yC), bHt=Math.max(1,bBot-bTop);
            return(
              <g key={c.id||i}>
                {/* wick */}
                <line x1={cx} y1={yH} x2={cx} y2={yL} stroke={fill} strokeWidth="1.5"/>
                {/* body */}
                <rect x={cx-bW/2} y={bTop} width={bW} height={bHt} fill={fill} opacity={up?0.85:0.9}/>
                {!c.verified&&<rect x={cx-bW/2} y={bTop} width={bW} height={bHt} fill="none" stroke="#94a3b8" strokeWidth="1" strokeDasharray="2,2"/>}
              </g>
            );
          })}

          {/* sentiment overlay line */}
          {sentPoints.length>=2&&(
            <polyline points={sentLine} fill="none" stroke={sentColor} strokeWidth="2" strokeDasharray="5,3" strokeLinecap="round" strokeLinejoin="round" opacity="0.9"/>
          )}
          {sentPoints.map((p,i)=>(
            <g key={i}>
              <circle cx={p.x} cy={p.y} r="4" fill={sentColor} opacity="0.9"/>
              <text x={p.x} y={p.y-7} textAnchor="middle" fontSize="9" fill={sentColor} fontFamily="DM Mono,monospace">{p.score>0?`+${p.score}`:p.score}</text>
            </g>
          ))}

          {/* axis labels */}
          <text x={mL-40} y={mT+cH/2} textAnchor="middle" fontSize="10" fill={C.muted} fontFamily="DM Sans,sans-serif" transform={`rotate(-90,${mL-40},${mT+cH/2})`}>ราคา (THB)</text>
          <text x={W-mR+50} y={mT+cH/2} textAnchor="middle" fontSize="10" fill={sentColor} fontFamily="DM Sans,sans-serif" transform={`rotate(90,${W-mR+50},${mT+cH/2})`} opacity="0.8">Sentiment</text>
        </svg>
      </div>

      {/* stats row */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:10,marginTop:12}}>
        {(()=>{
          const last=candles[candles.length-1];
          const first=candles[0];
          const chg=last&&first? ((last.close-first.close)/first.close*100) : null;
          const latestSent=sentPoints.length?sentPoints[sentPoints.length-1].score:null;
          return [
            {label:'ราคาปิดล่าสุด', val:`฿${last?.close?.toFixed(2)??'—'}`, color:C.text},
            {label:`เปลี่ยนแปลง ${n} วัน`, val:chg!==null?`${chg>=0?'+':''}${chg.toFixed(2)}%`:'—', color:chg>=0?'#059669':'#dc2626'},
            {label:'High/Low', val:`฿${Math.max(...candles.map(c=>c.high)).toFixed(2)} / ฿${Math.min(...candles.map(c=>c.low)).toFixed(2)}`, color:C.sub},
            {label:'Sentiment ล่าสุด', val:latestSent!==null?(latestSent>0?`+${latestSent}`:latestSent):'—', color:latestSent!==null?(latestSent>=20?'#059669':latestSent<=-20?'#dc2626':'#d97706'):C.muted},
          ];
        })().map((s,i)=>(
          <div key={i} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:'12px 14px'}}>
            <div style={{fontSize:11,color:C.muted,marginBottom:3}}>{s.label}</div>
            <div style={{fontFamily:'DM Mono',fontWeight:700,fontSize:15,color:s.color}}>{s.val}</div>
          </div>
        ))}
      </div>

      <div style={{fontSize:11,color:C.muted,marginTop:10,lineHeight:1.6}}>
        💡 <b>วิธีอ่าน:</b> แท่งเขียว = ราคาปิดสูงกว่าเปิด · แท่งแดง = ปิดต่ำกว่าเปิด · เส้นประฟ้า = Sentiment score (แกนขวา −100 ถึง +100) · เส้นประบนแท่ง = ข้อมูลยังไม่ verified
      </div>
    </div>
  );
};

// ── App ───────────────────────────────────────────────────────────────────────
const TABS=[
  {id:'overview', label:'ภาพรวม',    icon:'📊'},
  {id:'price',    label:'ราคา & โปร',icon:'💰'},
  {id:'sentiment',label:'Sentiment',  icon:'💬'},
  {id:'news',     label:'ข่าวสาร',   icon:'📰'},
  {id:'traffic',  label:'Traffic',    icon:'📈'},
  {id:'chart',    label:'Chart',      icon:'🕯️'},
];

const App = () => {
  const [data,  setData]  = useState(()=>loadData());
  const [tab,   setTab]   = useState('overview');
  const [stock, setStock] = useState(()=>{
    try{ const d=JSON.parse(localStorage.getItem(SOCIAL_KEY)||'null'); return d?.config?.trackedStocks?.[0]||DEF_STOCKS[0]; }catch{ return DEF_STOCKS[0]; }
  });
  const [showCfg, setShowCfg] = useState(false);

  useEffect(()=>{
    if(!data.config.trackedStocks.includes(stock)) setStock(data.config.trackedStocks[0]||DEF_STOCKS[0]);
  },[data.config.trackedStocks]);

  return (
    <div style={{minHeight:'100vh',background:C.bg,fontFamily:"'DM Sans','Noto Sans Thai',sans-serif",color:C.text}}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');*{box-sizing:border-box}`}</style>

      {/* TOPBAR */}
      <div style={{background:'#fff',borderBottom:`1px solid ${C.border}`,position:'sticky',top:0,zIndex:100,boxShadow:'0 1px 3px rgba(0,0,0,.05)'}}>
        <div style={{maxWidth:1200,margin:'0 auto',padding:'0 24px',display:'flex',alignItems:'center',gap:14,height:56}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <div style={{width:32,height:32,borderRadius:8,background:'linear-gradient(135deg,#6366f1,#8b5cf6)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:15}}>📡</div>
            <div>
              <div style={{fontSize:13,fontWeight:800,letterSpacing:-.3}}>SOCIAL LISTENING</div>
              <div style={{fontSize:9,color:C.muted,letterSpacing:.5}}>REDCODE DASHBOARD</div>
            </div>
          </div>
          <div style={{width:1,height:22,background:C.border}}/>
          <a href="index.html" style={{fontSize:12,color:C.indigo,textDecoration:'none',fontWeight:600}}>← Portfolio</a>
          <a href="monitor.html" style={{fontSize:12,color:'#10b981',textDecoration:'none',fontWeight:600,background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:6,padding:'3px 10px'}}>📊 Monitor</a>
          <div style={{display:'flex',gap:5}}>
            {data.config.trackedStocks.map(s=>(
              <button key={s} onClick={()=>setStock(s)}
                style={{padding:'4px 14px',borderRadius:999,border:'none',cursor:'pointer',fontFamily:'inherit',fontWeight:700,fontSize:12,transition:'all .15s',
                  background:s===stock?C.indigo:'#f1f5f9',color:s===stock?'#fff':C.sub}}>
                {s}
              </button>
            ))}
          </div>
          <div style={{flex:1}}/>
          <button onClick={()=>setShowCfg(v=>!v)}
            style={{background:'none',border:`1px solid ${C.border}`,borderRadius:8,padding:'6px 14px',cursor:'pointer',fontSize:12,color:C.sub,fontFamily:'inherit',fontWeight:600}}>
            ⚙️ ตั้งค่า
          </button>
        </div>
        {showCfg&&<ConfigPanel data={data} setData={setData} setStock={setStock}/>}
        <div style={{borderTop:`1px solid ${C.border}`}}>
          <div style={{maxWidth:1200,margin:'0 auto',padding:'0 24px',display:'flex'}}>
            {TABS.map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)}
                style={{padding:'12px 20px',border:'none',background:'none',cursor:'pointer',fontFamily:'inherit',fontSize:13,fontWeight:600,transition:'all .15s',
                  color:t.id===tab?C.indigo:C.muted,borderBottom:`2px solid ${t.id===tab?C.indigo:'transparent'}`,display:'flex',alignItems:'center',gap:5}}>
                {t.icon} {t.label}
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* CONTENT */}
      <div style={{maxWidth:1200,margin:'0 auto',padding:'24px 24px 48px'}}>
        {tab==='overview'  &&<OverviewTab  data={data} stock={stock}/>}
        {tab==='price'     &&<PriceTab     data={data} setData={setData} stock={stock}/>}
        {tab==='sentiment' &&<SentimentTab data={data} setData={setData} stock={stock}/>}
        {tab==='news'      &&<NewsTab      data={data} setData={setData} stock={stock}/>}
        {tab==='traffic'   &&<TrafficTab   data={data} setData={setData} stock={stock}/>}
        {tab==='chart'     &&<CandlestickTab data={data} stock={stock}/>}
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
